# XcodeGen spec — generates WorkoutSync.xcodeproj (gitignored). Run `xcodegen` in ios/.
# Team ID and bundle prefix come from Local.xcconfig (gitignored; copy the .example).
name: WorkoutSync
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  WorkoutSync:
    type: application
    platform: iOS
    sources:
      - path: WorkoutSync
        excludes: [Info.plist]
    entitlements:
      path: WorkoutSync/WorkoutSync.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).workoutsync
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        # Only what the INFOPLIST_KEY_ settings cannot express: the background mode that keeps
        # strap readings arriving while the phone is locked. Xcode merges it with the rest.
        INFOPLIST_FILE: WorkoutSync/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Workout Sync
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: Reads your workouts and their heart rate so they can be sent to your own workout tracker.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Saves the workouts you record in this app, with their heart rate, to Health.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Connects to your heart-rate strap to record a workout's heart rate.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.4"
        CURRENT_PROJECT_VERSION: "10"
        SWIFT_VERSION: "5.0"
