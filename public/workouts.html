<title>Workouts</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface-1: #fcfcfb; --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --hover-wash: rgba(11,11,11,0.04); --series-1: #2a78d6;
  --cat-1: #2a78d6; --cat-2: #eb6834; --cat-3: #1baf7a; --cat-4: #eda100; --cat-5: #e87ba4; --cat-6: #008300; --cat-7: #4a3aa7; --cat-8: #e34948; --cat-rest: #898781;
  --status-good: #0ca30c; --status-warn: #fab219; --status-bad: #d03b3b;
}
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) {
  color-scheme: dark; --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #fff; --text-secondary: #c3c2b7; --text-muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --hover-wash: rgba(255,255,255,0.06); --series-1: #3987e5;
  --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500; --cat-5: #d55181; --cat-6: #008300; --cat-7: #9085e9; --cat-8: #e66767; --cat-rest: #898781; } }
:root[data-theme="dark"] {
  color-scheme: dark; --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #fff; --text-secondary: #c3c2b7; --text-muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --hover-wash: rgba(255,255,255,0.06); --series-1: #3987e5;
  --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500; --cat-5: #d55181; --cat-6: #008300; --cat-7: #9085e9; --cat-8: #e66767; --cat-rest: #898781; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text-primary); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.subtitle { color: var(--text-muted); font-size: 13px; } .spacer { flex: 1; }
.filters { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.filter-set { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .filter-label { font-size: 12px; color: var(--text-muted); }
.group { display: flex; gap: 2px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.group button { font: inherit; font-size: 13px; color: var(--text-secondary); background: none; border: 0; border-radius: 6px; padding: 5px 11px; cursor: pointer; }
.group button:hover { background: var(--hover-wash); } .group button[aria-pressed="true"] { background: var(--series-1); color: #fff; }
.group button:focus-visible, .icon-btn:focus-visible, .link:focus-visible, select:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.icon-btn { font: inherit; font-size: 13px; color: var(--text-secondary); cursor: pointer; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 11px; text-decoration: none; }
.icon-btn:hover { background: var(--hover-wash); }
select { font: inherit; font-size: 13px; color: var(--text-primary); cursor: pointer; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
.tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.tile .label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
.tile .value { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; } .tile .unit { font-size: 14px; font-weight: 400; color: var(--text-secondary); margin-left: 2px; }
.tile .sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 18px 18px 14px; margin-bottom: 16px; }
.card-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; } .card h2 { font-size: 14px; font-weight: 600; margin: 0; } .card .note { font-size: 12px; color: var(--text-muted); } .card .plot { margin-top: 14px; }
.stale { opacity: 0.45; transition: opacity 120ms ease; }
svg { display: block; width: 100%; overflow: visible; } svg text { fill: var(--text-muted); font-size: 11px; }
svg .tick-value { font-variant-numeric: tabular-nums; } svg .grid-line { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; } svg .axis-line { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
svg .hit { fill: transparent; cursor: pointer; outline: none; } svg .hit:focus-visible + .mark, svg .hit:hover + .mark { opacity: 0.78; }
svg .series { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg .pt { stroke: var(--surface-1); stroke-width: 2; } svg .pt.low { fill: var(--surface-1) !important; stroke-width: 2; }
svg .program { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; } svg .program-label { fill: var(--text-muted); font-size: 10px; }
svg .value-label { fill: var(--text-secondary); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .spark { fill: none; stroke: var(--series-1); stroke-width: 1.5; }
.tip { position: fixed; z-index: 10; pointer-events: none; opacity: 0; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.13); transition: opacity 90ms ease; max-width: 260px; }
.tip[data-show="1"] { opacity: 1; } .tip .tip-head { color: var(--text-muted); margin-bottom: 4px; }
.tip-row { display: flex; align-items: center; gap: 7px; white-space: nowrap; } .tip-row .v { font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; } .tip-row .k { color: var(--text-secondary); }
.tip-key { width: 10px; height: 2px; border-radius: 1px; background: var(--series-1); flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font-size: 12px; } .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); } .legend i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
table { width: 100%; border-collapse: collapse; font-size: 13px; } th, td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--border); }
th { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; } td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; padding-right: 0; } tbody tr:last-child td { border-bottom: 0; }
/* A right-aligned numeric column followed by a text column needs its own gap. */
td.num + td:not(.num), th.num + th:not(.num) { padding-left: 16px; }
.scroll { overflow-x: auto; }
.verdict { display: inline-flex; align-items: center; gap: 6px; } .verdict::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--grid); }
.verdict[data-v="progressing"]::before { background: var(--status-good); } .verdict[data-v="holding"]::before { background: var(--status-warn); } .verdict[data-v="regressing"]::before { background: var(--status-bad); }
.link { background: none; border: 0; padding: 0; font: inherit; font-size: 12px; color: var(--series-1); cursor: pointer; text-decoration: underline; }
.empty { color: var(--text-muted); padding: 28px 0; text-align: center; font-size: 13px; }
.gate { max-width: 400px; margin: 72px auto; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 22px; } .gate h2 { font-size: 15px; margin: 0 0 6px; } .gate p { color: var(--text-secondary); font-size: 13px; margin: 0 0 14px; }
.gate input { width: 100%; font: inherit; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--axis); background: var(--page); color: var(--text-primary); margin-bottom: 10px; }
.gate button { font: inherit; font-weight: 500; background: var(--series-1); color: #fff; border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; }
.err { color: #d03b3b; font-size: 12px; margin-top: 10px; } [hidden] { display: none !important; }

#app-splash { position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:#2a78d6; color:#fff; font:14px/1.5 system-ui,sans-serif; }
#app-splash img { width:112px; height:112px; border-radius:24px; }
#app-splash strong { font-size:22px; font-weight:600; } #app-splash small { font-size:13px; opacity:0.85; }

#app-splash img { animation:splash-swoop 1.1s cubic-bezier(0.22,0.7,0.3,1) both, splash-breathe 2s ease-in-out 1.1s infinite; }
.splash-dots { display:inline-flex; gap:4px; margin-left:6px; vertical-align:middle; }
.splash-dots i { display:block; width:4px; height:4px; border-radius:50%; background:currentColor; opacity:0.6; animation:splash-dot 1.2s ease-in-out infinite; }
.splash-dots i:nth-child(2) { animation-delay:0.15s; } .splash-dots i:nth-child(3) { animation-delay:0.3s; }
@keyframes splash-swoop {
  0% { transform:translate(calc(-50vw - 112px),calc(50vh + 112px)) rotate(-18deg) scale(0.75); opacity:0; }
  12% { opacity:1; }
  50% { transform:translate(calc(50vw - 80px),calc(-50vh + 124px)) rotate(10deg) scale(1.06); opacity:1; }
  78% { transform:translate(-8px,10px) rotate(-3deg) scale(0.98); opacity:1; }
  100% { transform:translate(0,0) rotate(0) scale(1); opacity:1; }
}
@keyframes splash-breathe { 0%,100% { transform:scale(1); opacity:0.9; } 50% { transform:scale(1.035); opacity:1; } }
@keyframes splash-dot { 0%,70%,100% { transform:translateY(0); opacity:0.35; } 35% { transform:translateY(-3px); opacity:1; } }
@media (prefers-reduced-motion:reduce) { #app-splash img, .splash-dots i { animation:none; } }
#app-splash[hidden] { display:none; }
#app-force-refresh { position:fixed; z-index:10000; right:max(16px,env(safe-area-inset-right)); bottom:max(16px,env(safe-area-inset-bottom)); min-height:44px; border:1px solid var(--border); border-radius:22px; padding:10px 14px; background:var(--surface-1); color:var(--text-primary); font:13px system-ui,sans-serif; box-shadow:0 2px 12px rgba(0,0,0,0.12); cursor:pointer; }
#app-force-refresh:focus-visible { outline:2px solid var(--series-1); outline-offset:3px; }
#app-force-refresh:disabled { opacity:0.7; cursor:wait; }
#app-refresh-status { position:fixed; z-index:10000; right:16px; bottom:76px; max-width:280px; padding:10px 14px; border-radius:8px; background:var(--surface-1); color:var(--text-primary); border:1px solid var(--border); font:13px/1.5 system-ui,sans-serif; }
/* Heart-rate zones borrow the dashboard's validated heatmap ramp: zone 1 is the de-emphasis grey. */
:root { --zone-1: var(--cat-rest); --zone-2: #86b6ef; --zone-3: #5598e7; --zone-4: #2a78d6; --zone-5: #184f95; }
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) { --zone-2: #184f95; --zone-3: #256abf; --zone-4: #3987e5; --zone-5: #86b6ef; } }
:root[data-theme="dark"] { --zone-2: #184f95; --zone-3: #256abf; --zone-4: #3987e5; --zone-5: #86b6ef; }
input[type="search"] { font: inherit; font-size: 13px; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; width: 180px; }
input[type="search"]:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.zone-bar { display: flex; gap: 1px; width: 84px; height: 8px; border-radius: 2px; overflow: hidden; margin-left: auto; }
.zone-bar.wide { width: 100%; height: 12px; margin: 0 0 10px; }
.zone-bar i { display: block; height: 100%; }
#list tr.month th { font-size: 12px; text-transform: none; letter-spacing: 0; color: var(--text-secondary); padding-top: 18px; font-weight: 600; }
#list tr.month th .note { font-weight: 400; color: var(--text-muted); margin-left: 8px; }
#list tbody tr.row:hover td { background: var(--hover-wash); }
#list tr.row[data-open="1"] td { border-bottom-color: transparent; }
#list tr.row.target td { box-shadow: inset 0 -2px 0 var(--series-1); }
.when { white-space: nowrap; } .when small { color: var(--text-muted); margin-left: 6px; font-variant-numeric: tabular-nums; }
.open-btn { font: inherit; color: var(--text-primary); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; display: inline-flex; gap: 6px; align-items: baseline; }
.open-btn::before { content: "▸"; color: var(--text-muted); font-size: 11px; transition: transform 100ms ease; display: inline-block; }
.open-btn[aria-expanded="true"]::before { transform: rotate(90deg); }
.open-btn:hover { color: var(--series-1); } .open-btn:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; border-radius: 3px; }
tr.detail > td { padding: 4px 0 18px; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 20px; margin-bottom: 14px; }
.detail-grid dt { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
.detail-grid dd { margin: 2px 0 0; font-variant-numeric: tabular-nums; } .detail-grid dd small { display: block; color: var(--text-muted); font-size: 12px; }
.detail-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; } .detail-cols h3 { font-size: 12px; font-weight: 600; margin: 0 0 8px; color: var(--text-secondary); }
.detail-cols table { font-size: 12px; } .zone-key { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.detail-foot { margin-top: 12px; font-size: 12px; color: var(--text-muted); display: flex; gap: 14px; flex-wrap: wrap; } .detail-foot a { color: var(--series-1); }
.notes { white-space: pre-wrap; margin: 0 0 12px; padding: 8px 10px; border-left: 2px solid var(--axis); color: var(--text-secondary); }
.more { display: flex; justify-content: center; margin-top: 14px; }
#list td.num { white-space: nowrap; } #list .num { padding-left: 12px; }
@media (max-width: 680px) { .opt, .when small { display: none; } .detail-cols { grid-template-columns: 1fr; } input[type="search"] { width: 100%; } .filter-set.grow { flex: 1 1 100%; } }
</style>

<body>
<div id="app-splash" role="status" aria-label="Loading Workout Tracker">
  <img src="/api/app-assets/icon-v1-192.png" width="112" height="112" alt="">
  <strong>Workout Tracker</strong><small>Loading your training<span class="splash-dots" aria-hidden="true"><i></i><i></i><i></i></span></small>
</div>
<button id="app-force-refresh" type="button" title="Clear app caches and load the latest version. Your saved key stays on this device.">↻ Refresh app</button>
<div id="app-refresh-status" role="status" hidden></div>
<script>setTimeout(() => { document.getElementById("app-splash").hidden = true; }, 8000); document.getElementById("app-force-refresh").onclick = () => location.reload();</script>
<script src="/api/app-assets/app-shell.js" defer></script>
<noscript><style>#app-splash{display:none}</style></noscript>
<div class="wrap">
  <div id="gate" class="gate" hidden>
    <h2>API key</h2><p>Same key as the dashboard. Kept in this browser only.</p>
    <input id="gate-key" type="password" autocomplete="current-password" placeholder="x-api-key" spellcheck="false">
    <button id="gate-go" type="button">Open</button><div id="gate-err" class="err" hidden></div>
  </div>

  <div id="app" hidden>
    <header>
      <h1>Workouts</h1><span class="subtitle" id="span-label"></span><span class="spacer"></span>
      <a class="icon-btn" href="/api/dashboard">← Dashboard</a>
      <a class="icon-btn" href="/api/strength">Strength →</a>
      <a class="icon-btn" href="/api/recovery">Recovery →</a>
      <a class="icon-btn" href="/api/map">Routes →</a>
      <button class="icon-btn" id="theme-toggle" type="button">Theme</button>
    </header>

    <div class="filters">
      <div class="filter-set"><span class="filter-label">Range</span>
        <div class="group" id="range-group" role="group" aria-label="Time range">
          <button type="button" data-range="90">90 d</button>
          <button type="button" data-range="365">1 y</button>
          <button type="button" data-range="730">2 y</button>
          <button type="button" data-range="all">All</button>
        </div></div>
      <div class="filter-set"><span class="filter-label">Activity</span><select id="activity" aria-label="Activity"></select></div>
      <div class="filter-set"><span class="filter-label">Sort</span>
        <select id="sort" aria-label="Sort by">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="duration">Longest</option>
          <option value="distance">Farthest</option>
          <option value="effort">Hardest effort</option>
          <option value="heartRate">Highest average HR</option>
        </select></div>
      <div class="filter-set grow"><input id="search" type="search" placeholder="Search notes, source…" aria-label="Search notes and source"></div>
    </div>

    <div id="kpis" class="kpis"></div>

    <div class="card">
      <div class="card-head"><h2 id="list-title">All workouts</h2><span class="note" id="list-note"></span></div>
      <div class="scroll" id="list"></div>
      <div class="more"><button class="icon-btn" id="more" type="button" hidden>Show more</button></div>
    </div>

    <div id="error" class="err" hidden></div>
  </div>
</div>

<script type="module">
"use strict";
const KEY_STORAGE = "workout-tracker.apiKey", THEME_STORAGE = "workout-tracker.theme";
const PAGE = 100;
const state = { key: "", all: [], truncated: false, range: "365", activity: "", sort: "newest", query: "", shown: PAGE, open: new Set(), target: "" };
function readStored(n) { try { return localStorage.getItem(n) ?? ""; } catch { return ""; } }
function writeStored(n, v) { try { v ? localStorage.setItem(n, v) : localStorage.removeItem(n); } catch {} }

/* ---- formatting ---- */
function formatDuration(seconds) {
  const total = Math.round(seconds / 60), h = Math.floor(total / 60), m = total % 60;
  if (h === 0) return `${m}m`; if (m === 0) return `${h}h`; return `${h}h ${m}m`;
}
const clock = (iso) => new Date(iso).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
const day = (iso, opts = { weekday: "short", day: "numeric", month: "short" }) => new Date(iso).toLocaleDateString(undefined, opts);
/* The list's date: the year only when it is not this one — a sort by effort spans years. */
const THIS_YEAR = new Date().getFullYear();
const rowDay = (iso) => day(iso, new Date(iso).getFullYear() === THIS_YEAR ? undefined : { weekday: "short", day: "numeric", month: "short", year: "numeric" });
const km = (m) => (m ? `${(m / 1000).toFixed(m < 10000 ? 2 : 1)} km` : "—");
const kmShort = (m) => (m ? `${(m / 1000).toFixed(m < 10000 ? 1 : 0)} km` : "0 km");
const monthKey = (iso) => { const d = new Date(iso); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; };
const monthLabel = (key) => { const [y, m] = key.split("-"); return new Date(+y, +m - 1, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" }); };
const isEstimate = (w) => w.effortModel === "met-minutes";
const effortText = (w) => `${Math.round(w.effort)}${isEstimate(w) ? "*" : ""}`;

/* Pace where the sport is talked about in pace, speed where it is talked about in speed. */
const PACE_PER_KM = new Set(["running", "walking", "hiking"]);
function paceOf(w) {
  if (!w.distanceMeters || w.distanceMeters < 50) return null;
  const perKm = w.durationSeconds / (w.distanceMeters / 1000);
  const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
  if (w.activityType === "swimming") return `${mmss(w.durationSeconds / (w.distanceMeters / 100))} /100 m`;
  if (PACE_PER_KM.has(w.activityType)) return `${mmss(perKm)} /km`;
  return `${(w.distanceMeters / 1000 / (w.durationSeconds / 3600)).toFixed(1)} km/h`;
}

/* ---- tiny DOM helpers; every label goes in through textContent ---- */
function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v); }
  for (const c of children) if (c !== null && c !== undefined) e.append(c);
  return e;
}
function emptyNote(t) { return el("div", { class: "empty", text: t }); }

const ZONES = [0, 1, 2, 3, 4].map((i) => ({ index: i, label: `Zone ${i + 1}`, color: `var(--zone-${i + 1})` }));
function zoneBar(zones, wide = false) {
  const total = zones.reduce((a, b) => a + b, 0) || 1;
  const text = ZONES.map((z) => `Z${z.index + 1} ${formatDuration(zones[z.index])}`).join(" · ");
  const bar = el("span", { class: wide ? "zone-bar wide" : "zone-bar", role: "img", "aria-label": text, title: text });
  for (const z of ZONES) if (zones[z.index]) { const seg = el("i"); seg.style.background = z.color; seg.style.width = `${(zones[z.index] / total) * 100}%`; bar.append(seg); }
  return bar;
}

/* ---- filtering ---- */
function inScope() {
  const since = state.range === "all" ? 0 : Date.now() - Number(state.range) * 86400000;
  const q = state.query.trim().toLowerCase();
  return state.all.filter((w) => Date.parse(w.startedAt) >= since
    && (!state.activity || w.activityType === state.activity)
    && (!q || [w.label, w.notes, w.sourceName, w.source].some((s) => s && s.toLowerCase().includes(q))));
}
const SORTS = {
  newest: (a, b) => b.startedAt.localeCompare(a.startedAt),
  oldest: (a, b) => a.startedAt.localeCompare(b.startedAt),
  duration: (a, b) => b.durationSeconds - a.durationSeconds,
  distance: (a, b) => (b.distanceMeters ?? 0) - (a.distanceMeters ?? 0),
  effort: (a, b) => b.effort - a.effort,
  heartRate: (a, b) => (b.averageHeartRate ?? 0) - (a.averageHeartRate ?? 0),
};
const chronological = () => state.sort === "newest" || state.sort === "oldest";

/* The same activity's previous sessions, for "how did this one compare" — the ten before it. */
const byActivity = new Map();
function typicalBefore(w) {
  const list = byActivity.get(w.activityType) ?? [];
  const i = list.indexOf(w);
  const prior = list.slice(Math.max(0, i - 10), i).map((p) => p.effort).sort((a, b) => a - b);
  if (prior.length < 3) return null;
  const mid = Math.floor(prior.length / 2);
  return { n: prior.length, median: prior.length % 2 ? prior[mid] : (prior[mid - 1] + prior[mid]) / 2 };
}

/* ---- render ---- */
function renderKpis(rows) {
  const sum = (f) => rows.reduce((a, w) => a + (f(w) ?? 0), 0);
  const withHr = rows.filter((w) => w.averageHeartRate).length;
  const days = new Set(rows.map((w) => day(w.startedAt, { year: "numeric", month: "numeric", day: "numeric" }))).size;
  const tiles = [
    { label: "Workouts", value: rows.length.toLocaleString(), sub: `${days.toLocaleString()} active days` },
    { label: "Time", value: formatDuration(sum((w) => w.durationSeconds)), sub: rows.length ? `${formatDuration(sum((w) => w.durationSeconds) / rows.length)} per workout` : "" },
    { label: "Distance", value: kmShort(sum((w) => w.distanceMeters)), sub: `${rows.filter((w) => w.distanceMeters).length.toLocaleString()} with distance` },
    { label: "Effort", value: Math.round(sum((w) => w.effort)).toLocaleString(), sub: `${withHr.toLocaleString()} scored on heart rate` },
  ];
  document.getElementById("kpis").replaceChildren(...tiles.map((t) => el("div", { class: "tile" }, el("div", { class: "label", text: t.label }), el("div", { class: "value", text: t.value }), t.sub ? el("div", { class: "sub", text: t.sub }) : null)));
}

const HEADERS = [["Date"], ["Activity"], ["Time", "num"], ["Distance", "num opt"], ["Avg HR", "num opt"], ["Effort", "num"], ["Zones", "num opt"]];

function rowFor(w) {
  const open = state.open.has(w.id);
  const btn = el("button", { class: "open-btn", type: "button", "aria-expanded": String(open), "aria-controls": `d-${w.id}`, text: w.label });
  btn.addEventListener("click", () => { state.open.has(w.id) ? state.open.delete(w.id) : state.open.add(w.id); renderList(); });
  const tr = el("tr", { class: "row", id: w.id, "data-open": open ? "1" : "0" },
    el("td", { class: "when" }, rowDay(w.startedAt), el("small", { text: clock(w.startedAt) })),
    el("td", {}, btn),
    el("td", { class: "num", text: formatDuration(w.durationSeconds) }),
    el("td", { class: "num opt", text: w.distanceMeters ? kmShort(w.distanceMeters) : "—" }),
    el("td", { class: "num opt", text: w.averageHeartRate ? `${Math.round(w.averageHeartRate)}` : "—" }),
    el("td", { class: "num", text: effortText(w) }),
    el("td", { class: "num opt" }, w.heartRateZones ? zoneBar(w.heartRateZones) : "—"));
  if (w.id === state.target) tr.classList.add("target");
  return tr;
}

function detailFor(w) {
  const items = [];
  const add = (k, v, small) => items.push(el("div", {}, el("dt", { text: k }), el("dd", {}, v, small ? el("small", { text: small }) : null)));
  add("When", `${day(w.startedAt, { weekday: "long", day: "numeric", month: "long", year: "numeric" })}`, `${clock(w.startedAt)} – ${clock(w.endedAt)}`);
  add("Duration", formatDuration(w.durationSeconds));
  if (w.distanceMeters) add("Distance", km(w.distanceMeters), paceOf(w));
  if (w.activeEnergyKcal || w.totalEnergyKcal) add("Energy", w.activeEnergyKcal ? `${Math.round(w.activeEnergyKcal)} kcal active` : "—", w.totalEnergyKcal ? `${Math.round(w.totalEnergyKcal)} kcal total` : null);
  if (w.averageHeartRate) {
    const range = w.minHeartRate && w.maxHeartRate ? `${Math.round(w.minHeartRate)}–${Math.round(w.maxHeartRate)} bpm range` : w.maxHeartRate ? `peak ${Math.round(w.maxHeartRate)} bpm` : null;
    add("Heart rate", `${Math.round(w.averageHeartRate)} bpm average`, range);
  }
  if (w.maxHeartRateReference) add("Max HR reference", `${Math.round(w.maxHeartRateReference)} bpm`, w.averageHeartRate ? `average at ${Math.round((w.averageHeartRate / w.maxHeartRateReference) * 100)}% of it` : "trailing-year peak at the time");
  const typical = typicalBefore(w);
  const vs = typical && typical.median > 0 ? `${w.effort >= typical.median ? "+" : "−"}${Math.abs(Math.round((w.effort / typical.median - 1) * 100))}% vs median of previous ${typical.n} ${w.label}` : null;
  add("Effort", `${Math.round(w.effort)} · ${(w.effort / (w.durationSeconds / 60)).toFixed(2)} per min`, vs);
  add("Scored by", isEstimate(w) ? "Duration × activity" : "Heart rate (TRIMP)", isEstimate(w) ? "an estimate — no heart rate recorded" : null);
  add("Recorded by", w.sourceName || "—", ({ "health-export": "Apple Health export", shortcut: "Health Auto Export / Shortcut", manual: "Manual entry" })[w.source] ?? w.source);

  const parts = [];
  if (w.notes) parts.push(el("p", { class: "notes", text: w.notes }));
  parts.push(el("dl", { class: "detail-grid" }, ...items));

  let zonesPart = [el("div", { class: "note", text: w.averageHeartRate ? "Only summary heart rate was recorded — no sample stream to zone." : "No heart rate recorded." })];
  if (w.heartRateZones) {
    const total = w.heartRateZones.reduce((a, b) => a + b, 0) || 1, bpm = w.heartRateZoneBpm;
    const table = el("table", {}, el("thead", {}, el("tr", {}, el("th", { text: "Zone" }), el("th", { text: "bpm" }), el("th", { class: "num", text: "Time" }), el("th", { class: "num", text: "Share" }))),
      el("tbody", {}, ...ZONES.map((z) => {
        const range = bpm ? (z.index === 0 ? `< ${bpm[1]}` : z.index === 4 ? `${bpm[4]}+` : `${bpm[z.index]}–${bpm[z.index + 1] - 1}`) : "—";
        const key = el("span", { class: "zone-key" }); key.style.background = z.color;
        return el("tr", {}, el("td", {}, key, z.label), el("td", { text: range }), el("td", { class: "num", text: formatDuration(w.heartRateZones[z.index]) }), el("td", { class: "num", text: `${Math.round((w.heartRateZones[z.index] / total) * 100)}%` }));
      })));
    zonesPart = [zoneBar(w.heartRateZones, true), table];
  }
  parts.push(el("div", { class: "detail-cols" },
    el("div", {}, el("h3", { text: "Time in heart-rate zones" }), ...zonesPart),
    el("div", {}, el("h3", { text: `Effort against the previous ${w.label} sessions` }), effortStrip(w))));
  const link = el("a", { href: `#${w.id}`, text: "Link to this workout" });
  parts.push(el("div", { class: "detail-foot" }, link, el("span", { text: `id ${w.id.slice(0, 8)}` })));
  return el("tr", { class: "detail", id: `d-${w.id}` }, el("td", { colspan: String(HEADERS.length) }, ...parts));
}

/* Effort of this session against the ten before it of the same activity — a small table, values in text. */
function effortStrip(w) {
  const list = byActivity.get(w.activityType) ?? [];
  const i = list.indexOf(w);
  const slice = list.slice(Math.max(0, i - 10), i + 1);
  if (slice.length < 2) return el("div", { class: "note", text: `The first ${w.label} on record.` });
  const max = Math.max(...slice.map((p) => p.effort), 1);
  const rows = slice.reverse().map((p) => {
    const bar = el("span", { class: "zone-bar", role: "presentation" }); bar.style.width = "120px"; bar.style.marginLeft = "0";
    const fill = el("i"); fill.style.width = `${(p.effort / max) * 100}%`; fill.style.background = p === w ? "var(--series-1)" : "var(--axis)"; bar.append(fill);
    return el("tr", {}, el("td", { text: day(p.startedAt, { day: "numeric", month: "short", year: "2-digit" }) + (p === w ? " · this one" : "") }), el("td", { class: "num", text: effortText(p) }), el("td", {}, bar));
  });
  return el("table", {}, el("thead", {}, el("tr", {}, el("th", { text: "Date" }), el("th", { class: "num", text: "Effort" }), el("th", { text: "" }))), el("tbody", {}, ...rows));
}

function renderList() {
  const rows = inScope().sort(SORTS[state.sort]);
  renderKpis(rows);
  const host = document.getElementById("list");
  const shown = rows.slice(0, state.shown);
  document.getElementById("list-note").textContent = rows.length ? `${shown.length.toLocaleString()} of ${rows.length.toLocaleString()} shown${state.truncated ? " · history truncated at the API cap" : ""}` : "";
  const more = document.getElementById("more");
  more.hidden = shown.length >= rows.length;
  more.textContent = `Show ${Math.min(PAGE, rows.length - shown.length)} more`;
  if (!rows.length) { host.replaceChildren(emptyNote("No workouts match.")); return; }

  // Month subtotals across the whole filtered set, not just the shown page.
  const months = new Map();
  if (chronological()) for (const w of rows) { const k = monthKey(w.startedAt); const m = months.get(k) ?? { n: 0, s: 0, d: 0 }; m.n++; m.s += w.durationSeconds; m.d += w.distanceMeters ?? 0; months.set(k, m); }

  const head = el("thead", {}, el("tr", {}, ...HEADERS.map(([t, c]) => el("th", c ? { class: c, text: t } : { text: t }))));
  const body = el("tbody");
  let current = "";
  for (const w of shown) {
    if (chronological()) {
      const k = monthKey(w.startedAt);
      if (k !== current) {
        current = k; const m = months.get(k);
        body.append(el("tr", { class: "month" }, el("th", { colspan: String(HEADERS.length), scope: "colgroup" }, monthLabel(k),
          el("span", { class: "note", text: `${m.n} workout${m.n === 1 ? "" : "s"} · ${formatDuration(m.s)}${m.d ? ` · ${kmShort(m.d)}` : ""}` }))));
      }
    }
    body.append(rowFor(w));
    if (state.open.has(w.id)) body.append(detailFor(w));
  }
  const table = el("table", {}, head, body);
  host.replaceChildren(table);
  if (rows.some(isEstimate)) host.append(el("div", { class: "note", style: "margin-top:8px", text: "* effort estimated from duration and activity — no heart rate recorded" }));
}

function renderActivities() {
  const counts = new Map();
  for (const w of state.all) { const c = counts.get(w.activityType) ?? { label: w.label, n: 0 }; c.n++; counts.set(w.activityType, c); }
  const select = document.getElementById("activity");
  const opts = [...counts].sort((a, b) => b[1].n - a[1].n).map(([slug, c]) => el("option", { value: slug, text: `${c.label} (${c.n.toLocaleString()})` }));
  select.replaceChildren(el("option", { value: "", text: `All activities (${state.all.length.toLocaleString()})` }), ...opts);
  select.value = state.activity;
}

/* A link like /api/history#<id> opens that workout, widening the filters until it is in view. */
function focusTarget() {
  const id = decodeURIComponent(location.hash.slice(1));
  const w = id && state.all.find((x) => x.id === id);
  if (!w) return;
  state.target = id; state.open.add(id);
  if (!inScope().includes(w)) { state.range = "all"; state.activity = ""; state.query = ""; document.getElementById("search").value = ""; document.getElementById("activity").value = ""; selectRange(); }
  const index = inScope().sort(SORTS[state.sort]).indexOf(w);
  state.shown = Math.max(state.shown, Math.ceil((index + 1) / PAGE) * PAGE);
  renderList();
  document.getElementById(id)?.scrollIntoView({ block: "center" });
}

async function load() {
  const app = document.getElementById("app"), err = document.getElementById("error"); app.classList.add("stale"); err.hidden = true;
  try {
    // The whole history in one request: a few thousand rows, filtered here so every control is instant.
    const r = await fetch("/api/workouts?days=7300&limit=10000", { headers: { "x-api-key": state.key } });
    if (r.status === 401) { signOut("That key was rejected."); return; }
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    const data = await r.json();
    state.all = data.workouts; state.truncated = data.truncated;
    byActivity.clear();
    for (const w of state.all) (byActivity.get(w.activityType) ?? byActivity.set(w.activityType, []).get(w.activityType)).push(w);
    const first = state.all[0], last = state.all[state.all.length - 1];
    document.getElementById("span-label").textContent = first ? `${day(first.startedAt, { month: "short", year: "numeric" })} – ${day(last.startedAt, { month: "short", year: "numeric" })}` : "";
    renderActivities();
    renderList();
    focusTarget();
  } catch (e) { err.textContent = `Could not load workouts: ${e.message}`; err.hidden = false; }
  finally { app.classList.remove("stale"); window.workoutAppReady = true; document.dispatchEvent(new Event("workout-app-ready")); }
}

function selectRange() { for (const b of document.querySelectorAll("#range-group button")) b.setAttribute("aria-pressed", String(b.dataset.range === state.range)); }
const reset = () => { state.shown = PAGE; state.target = ""; renderList(); };

function init() {
  const t = readStored(THEME_STORAGE); if (t) document.documentElement.setAttribute("data-theme", t);
  selectRange();
  document.getElementById("range-group").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; state.range = b.dataset.range; selectRange(); reset(); });
  document.getElementById("activity").addEventListener("change", (e) => { state.activity = e.target.value; reset(); });
  document.getElementById("sort").addEventListener("change", (e) => { state.sort = e.target.value; reset(); });
  let st; document.getElementById("search").addEventListener("input", (e) => { clearTimeout(st); st = setTimeout(() => { state.query = e.target.value; reset(); }, 150); });
  document.getElementById("more").addEventListener("click", () => { state.shown += PAGE; renderList(); });
  addEventListener("hashchange", focusTarget);
  document.getElementById("theme-toggle").addEventListener("click", () => { const c = document.documentElement.getAttribute("data-theme"); const d = matchMedia("(prefers-color-scheme: dark)").matches; const n = c ? (c === "dark" ? "light" : "dark") : (d ? "light" : "dark"); document.documentElement.setAttribute("data-theme", n); writeStored(THEME_STORAGE, n); });
  document.getElementById("gate-go").addEventListener("click", () => { const v = document.getElementById("gate-key").value.trim(); if (v) start(v); });
  document.getElementById("gate-key").addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("gate-go").click(); });
  const fromUrl = new URL(location.href).searchParams.get("key"); if (fromUrl) history.replaceState(null, "", location.pathname + location.hash);
  const key = fromUrl || readStored(KEY_STORAGE); if (key) start(key); else signOut();
}
function signOut(msg) { window.workoutAppReady = true; document.dispatchEvent(new Event("workout-app-ready")); state.key = ""; writeStored(KEY_STORAGE, ""); document.getElementById("app").hidden = true; const g = document.getElementById("gate"); g.hidden = false; const e = document.getElementById("gate-err"); e.hidden = !msg; if (msg) e.textContent = msg; document.getElementById("gate-key").focus(); }
function start(key) { state.key = key; writeStored(KEY_STORAGE, key); document.getElementById("gate").hidden = true; document.getElementById("app").hidden = false; load(); }
init();
</script>
</body>
</html>
