<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Recovery</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface-1: #fcfcfb; --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --hover-wash: rgba(11,11,11,0.04); --series-1: #2a78d6;
  --cat-1: #2a78d6; --cat-2: #eb6834; --cat-3: #1baf7a; --cat-4: #eda100; --cat-5: #e87ba4; --cat-6: #008300; --cat-7: #4a3aa7; --cat-8: #e34948; --cat-rest: #898781;
  --status-good: #0ca30c; --status-warn: #fab219; --status-bad: #d03b3b;
}
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) {
  color-scheme: dark; --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #fff; --text-secondary: #c3c2b7; --text-muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --hover-wash: rgba(255,255,255,0.06); --series-1: #3987e5;
  --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500; --cat-5: #d55181; --cat-6: #008300; --cat-7: #9085e9; --cat-8: #e66767; --cat-rest: #898781; } }
:root[data-theme="dark"] {
  color-scheme: dark; --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #fff; --text-secondary: #c3c2b7; --text-muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --hover-wash: rgba(255,255,255,0.06); --series-1: #3987e5;
  --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500; --cat-5: #d55181; --cat-6: #008300; --cat-7: #9085e9; --cat-8: #e66767; --cat-rest: #898781; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text-primary); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.subtitle { color: var(--text-muted); font-size: 13px; } .spacer { flex: 1; }
.filters { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.filter-set { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .filter-label { font-size: 12px; color: var(--text-muted); }
.group { display: flex; gap: 2px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.group button { font: inherit; font-size: 13px; color: var(--text-secondary); background: none; border: 0; border-radius: 6px; padding: 5px 11px; cursor: pointer; }
.group button:hover { background: var(--hover-wash); } .group button[aria-pressed="true"] { background: var(--series-1); color: #fff; }
.group button:focus-visible, .icon-btn:focus-visible, .link:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.icon-btn { font: inherit; font-size: 13px; color: var(--text-secondary); cursor: pointer; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 11px; text-decoration: none; }
.icon-btn:hover { background: var(--hover-wash); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
.tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.tile .label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
.tile .value { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; } .tile .unit { font-size: 14px; font-weight: 400; color: var(--text-secondary); margin-left: 2px; }
.tile .sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.tile .delta { font-size: 12px; margin-top: 4px; display: inline-flex; gap: 5px; align-items: center; } .delta::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--grid); }
.delta[data-s="good"]::before { background: var(--status-good); } .delta[data-s="warn"]::before { background: var(--status-warn); } .delta[data-s="bad"]::before { background: var(--status-bad); }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 18px 18px 14px; margin-bottom: 16px; }
.card-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; } .card h2 { font-size: 14px; font-weight: 600; margin: 0; } .card .note { font-size: 12px; color: var(--text-muted); } .card .plot { margin-top: 14px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; } .two .card { margin-bottom: 16px; }
.smalls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 10px; }
.small { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; } .small .label { font-size: 12px; color: var(--text-muted); } .small .value { font-size: 18px; font-weight: 600; } .small .sub { font-size: 11px; color: var(--text-muted); }
.stale { opacity: 0.45; transition: opacity 120ms ease; }
svg { display: block; width: 100%; overflow: visible; } svg text { fill: var(--text-muted); font-size: 11px; }
svg .tick-value { font-variant-numeric: tabular-nums; } svg .grid-line { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; } svg .axis-line { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
svg .hit { fill: transparent; cursor: pointer; outline: none; } svg .hit:focus-visible + .mark, svg .hit:hover + .mark { opacity: 0.78; }
svg .series { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg .baseline { fill: none; stroke: var(--axis); stroke-width: 1.5; stroke-dasharray: 4 3; }
svg .band { fill: var(--grid); opacity: 0.6; }
svg .pt { stroke: var(--surface-1); stroke-width: 1.5; }
svg .ref { stroke: var(--axis); stroke-width: 1; stroke-dasharray: 2 3; shape-rendering: crispEdges; }
svg .value-label { fill: var(--text-secondary); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .spark { fill: none; stroke: var(--series-1); stroke-width: 1.5; }
.tip { position: fixed; z-index: 10; pointer-events: none; opacity: 0; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.13); transition: opacity 90ms ease; max-width: 280px; }
.tip[data-show="1"] { opacity: 1; } .tip .tip-head { color: var(--text-muted); margin-bottom: 4px; }
.tip-row { display: flex; align-items: center; gap: 7px; white-space: nowrap; } .tip-row .v { font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; } .tip-row .k { color: var(--text-secondary); }
.tip-key { width: 10px; height: 2px; border-radius: 1px; background: var(--series-1); flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font-size: 12px; } .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); } .legend i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
table { width: 100%; border-collapse: collapse; font-size: 13px; } th, td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--border); }
th { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; } td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; padding-right: 0; } tbody tr:last-child td { border-bottom: 0; }
td.num + td:not(.num), th.num + th:not(.num) { padding-left: 16px; }
.scroll { overflow-x: auto; }
.link { background: none; border: 0; padding: 0; font: inherit; font-size: 12px; color: var(--series-1); cursor: pointer; text-decoration: underline; }
.empty { color: var(--text-muted); padding: 28px 0; text-align: center; font-size: 13px; }
.gate { max-width: 400px; margin: 72px auto; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 22px; } .gate h2 { font-size: 15px; margin: 0 0 6px; } .gate p { color: var(--text-secondary); font-size: 13px; margin: 0 0 14px; }
.gate input { width: 100%; font: inherit; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--axis); background: var(--page); color: var(--text-primary); margin-bottom: 10px; }
.gate button { font: inherit; font-weight: 500; background: var(--series-1); color: #fff; border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; }
.err { color: #d03b3b; font-size: 12px; margin-top: 10px; } [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div id="gate" class="gate" hidden>
    <h2>API key</h2><p>Same key as the dashboard. Kept in this browser only.</p>
    <input id="gate-key" type="password" autocomplete="current-password" placeholder="x-api-key" spellcheck="false">
    <button id="gate-go" type="button">Open</button><div id="gate-err" class="err" hidden></div>
  </div>

  <div id="app" hidden>
    <header>
      <h1>Recovery</h1><span class="subtitle" id="span-label"></span><span class="spacer"></span>
      <a class="icon-btn" href="/api/dashboard">← Dashboard</a>
      <a class="icon-btn" href="/api/strength">Strength →</a>
      <button class="icon-btn" id="theme-toggle" type="button">Theme</button>
    </header>

    <div class="filters">
      <div class="filter-set"><span class="filter-label">Last</span>
        <div class="group" id="range-group" role="group" aria-label="Time range">
          <button type="button" data-range="30">30 d</button>
          <button type="button" data-range="90">90 d</button>
          <button type="button" data-range="180">180 d</button>
          <button type="button" data-range="365">1 y</button>
        </div></div>
    </div>

    <div id="kpis" class="kpis"></div>

    <div class="card">
      <div class="card-head"><h2>Sleep by night</h2><span class="note" id="sleep-note"></span></div>
      <div class="plot" id="sleep-chart"></div>
      <div class="legend" id="sleep-legend"></div>
      <button class="link" id="toggle-sleep-table" type="button" style="margin-top:10px">Show data table</button>
      <div id="sleep-table" hidden style="margin-top:12px" class="scroll"></div>
    </div>

    <div class="two">
      <div class="card">
        <div class="card-head"><h2>Resting heart rate</h2><span class="note" id="rhr-note"></span></div>
        <div class="plot" id="rhr-chart"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Heart-rate variability</h2><span class="note" id="hrv-note"></span></div>
        <div class="plot" id="hrv-chart"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Week by week — load against recovery</h2><span class="note" id="weeks-note"></span></div>
      <div class="scroll" id="weeks"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Other overnight signals</h2><span class="note">latest against the 90-day typical; a sparkline each</span></div>
      <div class="smalls" id="smalls"></div>
    </div>

    <div id="error" class="err" hidden></div>
  </div>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>

<script type="module">
"use strict";
const KEY_STORAGE = "workout-tracker.apiKey", THEME_STORAGE = "workout-tracker.theme";
const state = { key: "", data: null, range: "90" };
function readStored(n) { try { return localStorage.getItem(n) ?? ""; } catch { return ""; } }
function writeStored(n, v) { try { v ? localStorage.setItem(n, v) : localStorage.removeItem(n); } catch {} }

/* Fixed colour per sleep stage, never by rank. */
const STAGE = { deep: { label: "Deep", color: "var(--cat-7)" }, core: { label: "Core", color: "var(--cat-1)" }, rem: { label: "REM", color: "var(--cat-5)" }, awake: { label: "Awake", color: "var(--cat-rest)" } };

/* ---- svg helpers ---- */
const NS = "http://www.w3.org/2000/svg";
function svgEl(n, a = {}) { const e = document.createElementNS(NS, n); for (const [k, v] of Object.entries(a)) e.setAttribute(k, String(v)); return e; }
function svgText(x, y, t, a = {}) { const e = svgEl("text", { x, y, ...a }); e.appendChild(document.createTextNode(t)); return e; }
function niceTicks(lo, hi, count = 4) {
  const span = Math.max(1e-9, hi - lo), raw = span / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw) ?? 10 * mag;
  const start = Math.floor(lo / step) * step, end = Math.ceil(hi / step) * step; const t = [];
  for (let v = start; v <= end + step * 1e-6; v += step) t.push(Math.round(v * 1e6) / 1e6); return t;
}
const tip = document.getElementById("tip");
function showTip(e, head, rows) {
  tip.replaceChildren(); const h = document.createElement("div"); h.className = "tip-head"; h.textContent = head; tip.appendChild(h);
  for (const [k, v, c] of rows) { const r = document.createElement("div"); r.className = "tip-row"; const key = document.createElement("span"); key.className = "tip-key"; if (c) key.style.background = c; else key.style.visibility = "hidden";
    const vv = document.createElement("span"); vv.className = "v"; vv.textContent = v; const kk = document.createElement("span"); kk.className = "k"; kk.textContent = k; r.append(key, vv, kk); tip.appendChild(r); }
  tip.dataset.show = "1"; positionTip(e);
}
function positionTip(e) { const b = e.target.getBoundingClientRect(), t = tip.getBoundingClientRect(); let x = (e.clientX ?? b.left + b.width / 2) + 12, y = (e.clientY ?? b.top) - t.height - 10; if (x + t.width > innerWidth - 8) x = innerWidth - t.width - 8; if (y < 8) y = (e.clientY ?? b.bottom) + 16; tip.style.left = `${Math.max(8, x)}px`; tip.style.top = `${y}px`; }
const hideTip = () => { tip.dataset.show = "0"; };
function attachTip(hit, head, rows) { hit.setAttribute("tabindex", "0"); hit.setAttribute("role", "img"); hit.setAttribute("aria-label", `${head}: ${rows.map(([k, v]) => `${v} ${k}`).join(", ")}`);
  hit.addEventListener("pointerenter", (e) => showTip(e, head, rows)); hit.addEventListener("pointermove", positionTip); hit.addEventListener("pointerleave", hideTip); hit.addEventListener("focus", (e) => showTip(e, head, rows)); hit.addEventListener("blur", hideTip); }
function buildTable(headers, rows) {
  const t = document.createElement("table"), th = document.createElement("thead"), hr = document.createElement("tr");
  for (const h of headers) { const c = document.createElement("th"); const s = typeof h === "string" ? { text: h } : h; if (s.num) c.className = "num"; c.textContent = s.text; hr.appendChild(c); }
  th.appendChild(hr); const tb = document.createElement("tbody");
  for (const r of rows) { const tr = document.createElement("tr"); for (const cell of r) { const td = document.createElement("td"); const s = typeof cell === "string" ? { text: cell } : cell; if (s.num) td.className = "num"; if (s.el) td.appendChild(s.el); else td.textContent = s.text; tr.appendChild(td); } tb.appendChild(tr); }
  t.append(th, tb); return t;
}
const fmtDate = (iso, opts = { day: "numeric", month: "short" }) => new Date(`${iso}T12:00:00Z`).toLocaleDateString(undefined, { ...opts, timeZone: "UTC" });
const hm = (sec) => { if (sec === undefined) return "—"; const m = Math.round(sec / 60), h = Math.floor(m / 60); return `${h}h ${String(m % 60).padStart(2, "0")}m`; };
const clock = (min) => (min === undefined ? "—" : `${String(Math.floor((min % 1440) / 60)).padStart(2, "0")}:${String(Math.round(min % 60)).padStart(2, "0")}`);
function emptyNote(t) { const d = document.createElement("div"); d.className = "empty"; d.textContent = t; return d; }
const last = (arr, pick) => { for (let i = arr.length - 1; i >= 0; i--) { const v = pick(arr[i]); if (v !== undefined) return { d: arr[i], v }; } return undefined; };
const mean = (xs) => (xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : undefined);
const median = (xs) => { if (!xs.length) return undefined; const s = [...xs].sort((a, b) => a - b), m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
function circularSd(minutes) { if (minutes.length < 2) return 0; const a = (m) => ((m % 1440) / 1440) * 2 * Math.PI; const c = mean(minutes.map((m) => Math.cos(a(m)))), s = mean(minutes.map((m) => Math.sin(a(m)))); const r = Math.min(1, Math.hypot(c, s)); return r === 0 ? 720 : (Math.sqrt(-2 * Math.log(r)) / (2 * Math.PI)) * 1440; }

/* ---- tiles: where things stand, each against its own normal ---- */
function renderKpis() {
  const { days, typical } = state.data; const host = document.getElementById("kpis"); const tiles = [];
  const tile = (label, value, unit, sub, delta) => tiles.push({ label, value, unit, sub, delta });
  const night = last(days, (d) => d.sleepAsleepSeconds);
  if (night) {
    const d = night.d, vs = typical.asleepSeconds ? Math.round((d.sleepAsleepSeconds - typical.asleepSeconds) / 60) : undefined;
    tile(`Last night · ${fmtDate(d.date)}`, hm(d.sleepAsleepSeconds), "", `${d.sleepStaged ? `deep ${hm(d.sleepDeepSeconds)} · REM ${hm(d.sleepRemSeconds)} · ` : ""}${d.sleepAwakenings ?? 0} wake-ups · in bed ${clock(d.bedtimeMinutes)}–${clock(d.wakeMinutes)}`,
      vs === undefined ? undefined : { text: `${vs >= 0 ? "+" : "−"}${Math.abs(vs)} min vs typical ${hm(typical.asleepSeconds)}`, s: vs >= -30 ? "good" : vs >= -75 ? "warn" : "bad" });
  }
  const week = days.slice(-7).map((d) => d.sleepAsleepSeconds).filter((x) => x !== undefined);
  if (week.length) {
    const avg = mean(week), debt = typical.asleepSeconds ? Math.round(week.reduce((n, s) => n + (typical.asleepSeconds - s), 0) / 60) : undefined;
    tile("Sleep · last 7 nights", hm(avg), "", `${week.length} nights · typical ${hm(typical.asleepSeconds)}`,
      debt === undefined ? undefined : { text: debt > 0 ? `${hm(debt * 60)} short of typical over the week` : `${hm(-debt * 60)} ahead of typical`, s: debt <= 30 ? "good" : debt <= 120 ? "warn" : "bad" });
  }
  const rhr = last(days, (d) => d.restingHeartRate);
  if (rhr) {
    const b = rhr.d.restingHeartRateBaseline, delta = b === undefined ? undefined : rhr.v - b;
    tile(`Resting HR · ${fmtDate(rhr.d.date)}`, `${rhr.v}`, "bpm", b === undefined ? "no 28-day baseline yet" : `28-day baseline ${b}`,
      delta === undefined ? undefined : { text: `${delta > 0 ? "+" : ""}${Math.round(delta)} vs baseline`, s: delta <= 2 ? "good" : delta <= 5 ? "warn" : "bad" });
  }
  const hrv = last(days, (d) => d.hrv);
  if (hrv) {
    const b = hrv.d.hrvBaseline, pct = b ? Math.round(((hrv.v - b) / b) * 100) : undefined;
    tile(`HRV · ${fmtDate(hrv.d.date)}`, `${Math.round(hrv.v)}`, "ms", b === undefined ? "no 28-day baseline yet" : `28-day baseline ${Math.round(b)} · ${hrv.d.hrvSamples ?? "?"} readings`,
      pct === undefined ? undefined : { text: `${pct > 0 ? "+" : ""}${pct}% vs baseline`, s: pct >= -10 ? "good" : pct >= -25 ? "warn" : "bad" });
  }
  const beds = days.slice(-14).map((d) => d.bedtimeMinutes).filter((x) => x !== undefined);
  if (beds.length >= 3) {
    const sd = Math.round(circularSd(beds));
    tile("Bedtime · last 14 nights", `±${sd}`, "min", `median ${clock(median(beds))} · wake ${clock(median(days.slice(-14).map((d) => d.wakeMinutes).filter((x) => x !== undefined)))}`,
      { text: sd <= 30 ? "consistent" : sd <= 60 ? "drifting" : "irregular", s: sd <= 30 ? "good" : sd <= 60 ? "warn" : "bad" });
  }
  const wake = days.slice(-7).map((d) => d.sleepAwakenings).filter((x) => x !== undefined);
  if (wake.length) tile("Wake-ups · last 7 nights", (mean(wake)).toFixed(1), "/night", `typical ${typical.awakenings ?? "—"}`);
  host.replaceChildren(...tiles.map((t) => { const el = document.createElement("div"); el.className = "tile"; const l = document.createElement("div"); l.className = "label"; l.textContent = t.label; const v = document.createElement("div"); v.className = "value"; v.textContent = t.value; if (t.unit) { const u = document.createElement("span"); u.className = "unit"; u.textContent = t.unit; v.appendChild(u); }
    el.append(l, v); if (t.delta) { const d = document.createElement("div"); d.className = "delta"; d.dataset.s = t.delta.s; d.textContent = t.delta.text; el.appendChild(d); } const s = document.createElement("div"); s.className = "sub"; s.textContent = t.sub; el.appendChild(s); return el; }));
}

/* ---- sleep: stacked bars per night, stages in fixed slots, 7-night average as a line ---- */
function renderSleep() {
  const host = document.getElementById("sleep-chart"), note = document.getElementById("sleep-note"), legend = document.getElementById("sleep-legend");
  const nights = state.data.days.filter((d) => d.sleepAsleepSeconds !== undefined);
  if (!nights.length) { host.replaceChildren(emptyNote("No nights in this range.")); legend.replaceChildren(); note.textContent = ""; return; }
  const width = Math.max(320, host.clientWidth || 640), padL = 40, padR = 14, padT = 14, xAxis = 24, plotH = 200, height = plotH + padT + xAxis;
  const svg = svgEl("svg", { viewBox: `0 0 ${width} ${height}`, height, role: "presentation" });
  const t0 = Date.parse(`${nights[0].date}T00:00:00Z`) - 43_200_000, t1 = Date.parse(`${nights[nights.length - 1].date}T00:00:00Z`) + 43_200_000;
  const x = (t) => padL + ((t - t0) / (t1 - t0)) * (width - padL - padR);
  const dayW = Math.max(2, (width - padL - padR) / ((t1 - t0) / 86_400_000) - 2);
  const maxH = Math.max(...nights.map((d) => (d.sleepAsleepSeconds + (d.sleepAwakeSeconds ?? 0)) / 3600));
  const ticks = niceTicks(0, maxH * 1.08); const lo = 0, hi = ticks[ticks.length - 1]; const y = (h) => padT + plotH - ((h - lo) / (hi - lo)) * plotH;
  for (const t of ticks) { svg.appendChild(svgEl("line", { class: t === lo ? "axis-line" : "grid-line", x1: padL, x2: width - padR, y1: y(t), y2: y(t) })); svg.appendChild(svgText(padL - 8, y(t) + 4, `${t}h`, { class: "tick-value", "text-anchor": "end" })); }
  if (state.data.typical.asleepSeconds) { const ty = y(state.data.typical.asleepSeconds / 3600); svg.appendChild(svgEl("line", { class: "ref", x1: padL, x2: width - padR, y1: ty, y2: ty })); svg.appendChild(svgText(padL + 4, ty - 4, `typical ${hm(state.data.typical.asleepSeconds)}`, { class: "value-label" })); }
  // Month labels along the bottom, thinned to fit.

  const every = Math.max(1, Math.ceil((months.length * 44) / (width - padL - padR)));
  months.forEach((m, i) => { if (i % every === 0) svg.appendChild(svgText(x(m.getTime()), padT + plotH + 16, m.toLocaleDateString(undefined, { month: "short", timeZone: "UTC" }), { "text-anchor": "middle" })); });
  const order = ["deep", "core", "rem", "awake"];
  for (const d of nights) {
    const cx = x(Date.parse(`${d.date}T00:00:00Z`)), x0 = cx - dayW / 2;

    svg.appendChild(g);
    attachTip(hit, `Night ending ${fmtDate(d.date, { weekday: "short", day: "numeric", month: "short" })}`, [
      ["asleep", hm(d.sleepAsleepSeconds), null],
      ...(d.sleepStaged ? [["deep", hm(d.sleepDeepSeconds), STAGE.deep.color], ["core", hm(d.sleepCoreSeconds), STAGE.core.color], ["REM", hm(d.sleepRemSeconds), STAGE.rem.color]] : [["", "stages not recorded", null]]),
      ["awake", `${hm(d.sleepAwakeSeconds ?? 0)} · ${d.sleepAwakenings ?? 0} wake-ups`, STAGE.awake.color],

  if (avgPts.length > 1) svg.appendChild(svgEl("path", { class: "series", style: "stroke:var(--text-primary); stroke-width:1.5; opacity:0.75", d: avgPts.map((p, i) => `${i ? "L" : "M"}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join("") }));

    (() => { const i = document.createElement("span"); const sw = document.createElement("i"); sw.style.cssText = "height:2px; background:var(--text-primary); opacity:0.75"; const t = document.createElement("span"); t.textContent = "7-night average"; i.append(sw, t); return i; })());
  const staged = nights.filter((d) => d.sleepStaged);
  note.textContent = `${nights.length} nights · median ${hm(median(nights.map((d) => d.sleepAsleepSeconds)))}${staged.length ? ` · deep ${Math.round(mean(staged.map((d) => (d.sleepDeepSeconds ?? 0) / d.sleepAsleepSeconds)) * 100)}% · REM ${Math.round(mean(staged.map((d) => (d.sleepRemSeconds ?? 0) / d.sleepAsleepSeconds)) * 100)}%` : ""}`;
  if (!document.getElementById("sleep-table").hidden) renderSleepTable();
}
function renderSleepTable() {
  const rows = state.data.days.filter((d) => d.sleepAsleepSeconds !== undefined || d.restingHeartRate !== undefined).slice().reverse();
  document.getElementById("sleep-table").replaceChildren(buildTable(["Night ending", { text: "Asleep", num: true }, { text: "Deep", num: true }, { text: "REM", num: true }, { text: "Wake-ups", num: true }, "In bed", { text: "RHR", num: true }, { text: "HRV", num: true }, { text: "Resp", num: true }],
    rows.map((d) => [fmtDate(d.date, { weekday: "short", day: "numeric", month: "short" }), { text: hm(d.sleepAsleepSeconds), num: true }, { text: hm(d.sleepDeepSeconds), num: true }, { text: hm(d.sleepRemSeconds), num: true }, { text: d.sleepAwakenings === undefined ? "—" : `${d.sleepAwakenings}`, num: true }, d.bedtimeMinutes === undefined ? "—" : `${clock(d.bedtimeMinutes)}–${clock(d.wakeMinutes)}`, { text: d.restingHeartRate ? `${d.restingHeartRate}` : "—", num: true }, { text: d.hrv ? `${Math.round(d.hrv)}` : "—", num: true }, { text: d.respiratoryRate ? `${d.respiratoryRate}` : "—", num: true }])));
}

/* ---- a daily series with its 28-day baseline: one chart each, never a dual axis ---- */
function renderDaily(hostId, noteId, pick, base, unit, color, fmt = (v) => `${Math.round(v)}`) {
  const host = document.getElementById(hostId), note = document.getElementById(noteId);
  const pts = state.data.days.map((d) => ({ d, v: pick(d), b: base(d) })).filter((p) => p.v !== undefined);
  if (pts.length < 2) { host.replaceChildren(emptyNote("Not enough readings in this range.")); note.textContent = ""; return; }
  const width = Math.max(280, host.clientWidth || 480), padL = 36, padR = 12, padT = 12, xAxis = 22, plotH = 150, height = plotH + padT + xAxis;
  const svg = svgEl("svg", { viewBox: `0 0 ${width} ${height}`, height, role: "presentation" });
  const t0 = Date.parse(`${pts[0].d.date}T00:00:00Z`), t1 = Date.parse(`${pts[pts.length - 1].d.date}T00:00:00Z`); const x = (t) => padL + ((t - t0) / Math.max(1, t1 - t0)) * (width - padL - padR);
  const all = pts.flatMap((p) => [p.v, ...(p.b !== undefined ? [p.b] : [])]); const vmin = Math.min(...all), vmax = Math.max(...all);
  const ticks = niceTicks(vmin - (vmax - vmin) * 0.15, vmax + (vmax - vmin) * 0.15, 3); const lo = ticks[0], hi = ticks[ticks.length - 1]; const y = (v) => padT + plotH - ((v - lo) / (hi - lo)) * plotH;
  for (const t of ticks) { svg.appendChild(svgEl("line", { class: t === lo ? "axis-line" : "grid-line", x1: padL, x2: width - padR, y1: y(t), y2: y(t) })); svg.appendChild(svgText(padL - 6, y(t) + 4, fmt(t), { class: "tick-value", "text-anchor": "end" })); }
  const months = []; for (let d = new Date(t0); d.getTime() <= t1; d.setUTCDate(d.getUTCDate() + 1)) if (d.getUTCDate() === 1) months.push(new Date(d));
  const every = Math.max(1, Math.ceil((months.length * 44) / (width - padL - padR)));
  months.forEach((m, i) => { if (i % every === 0) svg.appendChild(svgText(x(m.getTime()), padT + plotH + 15, m.toLocaleDateString(undefined, { month: "short", timeZone: "UTC" }), { "text-anchor": "middle" })); });
  const withBase = pts.filter((p) => p.b !== undefined);

  svg.appendChild(svgEl("path", { class: "series", style: `stroke:${color}`, d: pts.map((p, i) => `${i ? "L" : "M"}${x(Date.parse(`${p.d.date}T00:00:00Z`)).toFixed(1)},${y(p.v).toFixed(1)}`).join("") }));

    svg.appendChild(svgEl("circle", { class: "pt mark", cx, cy, r, style: `fill:${color}` }));
    attachTip(hit, fmtDate(p.d.date, { weekday: "short", day: "numeric", month: "short" }), [[unit, fmt(p.v), color], ...(p.b !== undefined ? [["28-day baseline", fmt(p.b), "var(--axis)"], ["vs baseline", `${p.v - p.b > 0 ? "+" : ""}${fmt(p.v - p.b)}`, null]] : [])]); }
  const lastP = pts[pts.length - 1]; svg.appendChild(svgText(x(Date.parse(`${lastP.d.date}T00:00:00Z`)) + 6, y(lastP.v) + 4, fmt(lastP.v), { class: "value-label" }));
  host.replaceChildren(svg);
  const vals = pts.map((p) => p.v);
  note.textContent = `${pts.length} days · median ${fmt(median(vals))} · range ${fmt(Math.min(...vals))}–${fmt(Math.max(...vals))} ${unit} · dashed = 28-day baseline`;
}

/* ---- week by week: training load beside how the nights went ---- */
function renderWeeks() {
  const host = document.getElementById("weeks"), note = document.getElementById("weeks-note");
  const weeks = state.data.weeks.filter((w) => w.nights > 0 || w.sessions > 0).slice().reverse();
  if (!weeks.length) { host.replaceChildren(emptyNote("No weeks in this range.")); note.textContent = ""; return; }
  const maxEffort = Math.max(1, ...weeks.map((w) => w.effort));
  const bar = (v, max, color) => { const s = svgEl("svg", { viewBox: "0 0 80 10", width: 80, height: 10, role: "presentation" }); s.style.display = "inline-block"; s.appendChild(svgEl("rect", { x: 0, y: 2, width: Math.max(1, (v / max) * 80), height: 6, rx: 2, style: `fill:${color}` })); return s; };
  const cell = (v, max, color, text) => { const el = document.createElement("span"); el.style.cssText = "display:inline-flex; align-items:center; gap:8px; font-variant-numeric:tabular-nums"; el.append(bar(v, max, color), document.createTextNode(text)); return el; };
  host.replaceChildren(buildTable(["Week", { text: "Sessions", num: true }, "Effort", { text: "Sleep avg", num: true }, { text: "Deep", num: true }, { text: "REM", num: true }, { text: "Wake-ups", num: true }, "Bedtime", { text: "RHR", num: true }, { text: "HRV", num: true }],
    weeks.map((w) => [fmtDate(w.weekStart, { day: "numeric", month: "short" }), { text: `${w.sessions}`, num: true }, { el: cell(w.effort, maxEffort, "var(--series-1)", `${Math.round(w.effort)}`) },
      { text: w.asleepSeconds === undefined ? "—" : hm(w.asleepSeconds), num: true }, { text: w.deepPct === undefined ? "—" : `${w.deepPct.toFixed(0)}%`, num: true }, { text: w.remPct === undefined ? "—" : `${w.remPct.toFixed(0)}%`, num: true },
      { text: w.awakenings === undefined ? "—" : w.awakenings.toFixed(1), num: true }, w.bedtimeMinutes === undefined ? "—" : `${clock(w.bedtimeMinutes)}${w.bedtimeSdMinutes !== undefined ? ` ±${w.bedtimeSdMinutes}` : ""}`,
      { text: w.restingHeartRate === undefined ? "—" : `${w.restingHeartRate.toFixed(0)}`, num: true }, { text: w.hrv === undefined ? "—" : `${w.hrv.toFixed(0)}`, num: true }])));
  // The question the table exists for: do hard weeks cost sleep or raise the resting pulse?
  const paired = state.data.weeks.filter((w) => w.effort > 0 && w.restingHeartRate !== undefined);
  if (paired.length >= 6) {
    const r = corr(paired.map((w) => w.effort), paired.map((w) => w.restingHeartRate)), rs = corr(paired.filter((w) => w.asleepSeconds !== undefined).map((w) => w.effort), paired.filter((w) => w.asleepSeconds !== undefined).map((w) => w.asleepSeconds));
    note.textContent = `${paired.length} weeks · effort↔RHR r=${r.toFixed(2)}${Number.isFinite(rs) ? ` · effort↔sleep r=${rs.toFixed(2)}` : ""} (same week; |r| under 0.3 is noise)`;

}
function corr(a, b) { const n = Math.min(a.length, b.length); if (n < 3) return NaN; const ma = mean(a.slice(0, n)), mb = mean(b.slice(0, n)); let sab = 0, saa = 0, sbb = 0; for (let i = 0; i < n; i++) { sab += (a[i] - ma) * (b[i] - mb); saa += (a[i] - ma) ** 2; sbb += (b[i] - mb) ** 2; } return saa && sbb ? sab / Math.sqrt(saa * sbb) : NaN; }

/* ---- the other signals: small multiples ---- */
function renderSmalls() {
  const host = document.getElementById("smalls"); const days = state.data.days, typical = state.data.typical;
  const defs = [
    ["Respiratory rate", (d) => d.respiratoryRate, "/min", typical.respiratoryRate, (v) => v.toFixed(1)],
    ["Blood oxygen", (d) => d.spo2, "%", undefined, (v) => v.toFixed(1)],
    ["Wrist temperature", (d) => d.wristTemperature, "°C", undefined, (v) => v.toFixed(2), (d) => d.wristTemperatureBaseline],
    ["Breathing disturbances", (d) => d.breathingDisturbances, "/night", undefined, (v) => v.toFixed(1)],
    ["Time in daylight", (d) => d.daylightMinutes, "min", undefined, (v) => `${Math.round(v)}`],
  ];
  host.replaceChildren(...defs.map(([label, pick, unit, typ, fmt, base]) => {
    const pts = days.map((d) => ({ d, v: pick(d) })).filter((p) => p.v !== undefined);
    const el = document.createElement("div"); el.className = "small";
    const l = document.createElement("div"); l.className = "label"; l.textContent = label; el.appendChild(l);
    if (!pts.length) { const v = document.createElement("div"); v.className = "sub"; v.textContent = "not recorded in this range"; el.appendChild(v); return el; }
    const lastP = pts[pts.length - 1]; const b = base ? base(lastP.d) : typ;
    const v = document.createElement("div"); v.className = "value"; v.textContent = `${fmt(lastP.v)} ${unit}`; el.appendChild(v);
    const s = document.createElement("div"); s.className = "sub"; s.textContent = `${fmtDate(lastP.d.date)}${b !== undefined ? ` · ${base ? "baseline" : "typical"} ${fmt(b)}` : ""} · ${pts.length} days`; el.appendChild(s);
    const w = 180, h = 28; const svg = svgEl("svg", { viewBox: `0 0 ${w} ${h}`, width: w, height: h, role: "presentation" }); const vs = pts.map((p) => p.v); const lo = Math.min(...vs), hi = Math.max(...vs);
    const x = (i) => (i / Math.max(1, pts.length - 1)) * w, y = (val) => h - 2 - ((val - lo) / Math.max(1e-9, hi - lo)) * (h - 4);
    svg.appendChild(svgEl("path", { class: "spark", d: pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("") })); el.appendChild(svg);
    return el;
  }));
}

function renderAll() {
  const days = state.data.days; const first = days[0], lastD = days[days.length - 1];
  document.getElementById("span-label").textContent = first ? `${fmtDate(first.date, { day: "numeric", month: "short", year: "numeric" })} – ${fmtDate(lastD.date, { day: "numeric", month: "short", year: "numeric" })} · ${days.filter((d) => d.sleepAsleepSeconds !== undefined).length} nights` : "";
  renderKpis(); renderSleep();
  renderDaily("rhr-chart", "rhr-note", (d) => d.restingHeartRate, (d) => d.restingHeartRateBaseline, "bpm", "var(--cat-2)");
  renderDaily("hrv-chart", "hrv-note", (d) => d.hrv, (d) => d.hrvBaseline, "ms", "var(--cat-3)");
  renderWeeks(); renderSmalls();
}
async function load() {
  const app = document.getElementById("app"), err = document.getElementById("error"); app.classList.add("stale"); err.hidden = true;
  try {
    const r = await fetch(`/api/recovery/data?days=${state.range}`, { headers: { "x-api-key": state.key } });
    if (r.status === 401) { signOut("That key was rejected."); return; }
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    state.data = await r.json();
    renderAll();
  } catch (e) { err.textContent = `Could not load recovery data: ${e.message}`; err.hidden = false; }
  finally { app.classList.remove("stale"); }
}
function wireGroup(id, attr, onPick) {
  const g = document.getElementById(id); const sel = (v) => { for (const b of g.querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset[attr] === v)); };
  g.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; sel(b.dataset[attr]); onPick(b.dataset[attr]); }); sel(state[attr]);
}
function init() {
  const t = readStored(THEME_STORAGE); if (t) document.documentElement.setAttribute("data-theme", t);
  wireGroup("range-group", "range", (v) => { state.range = v; load(); });
  document.getElementById("toggle-sleep-table").addEventListener("click", (e) => { const p = document.getElementById("sleep-table"); p.hidden = !p.hidden; e.target.textContent = p.hidden ? "Show data table" : "Hide data table"; if (!p.hidden) renderSleepTable(); });
  document.getElementById("theme-toggle").addEventListener("click", () => { const c = document.documentElement.getAttribute("data-theme"); const d = matchMedia("(prefers-color-scheme: dark)").matches; const n = c ? (c === "dark" ? "light" : "dark") : (d ? "light" : "dark"); document.documentElement.setAttribute("data-theme", n); writeStored(THEME_STORAGE, n); });
  document.getElementById("gate-go").addEventListener("click", () => { const v = document.getElementById("gate-key").value.trim(); if (v) start(v); });
  document.getElementById("gate-key").addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("gate-go").click(); });
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (state.data) renderAll(); }, 120); });
  const fromUrl = new URL(location.href).searchParams.get("key"); if (fromUrl) history.replaceState(null, "", location.pathname);
  const key = fromUrl || readStored(KEY_STORAGE); if (key) start(key); else signOut();
}
function signOut(msg) { state.key = ""; writeStored(KEY_STORAGE, ""); document.getElementById("app").hidden = true; const g = document.getElementById("gate"); g.hidden = false; const e = document.getElementById("gate-err"); e.hidden = !msg; if (msg) e.textContent = msg; document.getElementById("gate-key").focus(); }
function start(key) { state.key = key; writeStored(KEY_STORAGE, key); document.getElementById("gate").hidden = true; document.getElementById("app").hidden = false; load(); }
init();
</script>
