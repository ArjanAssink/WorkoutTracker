<title>Notifications</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface-1: #fcfcfb; --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --hover-wash: rgba(11,11,11,0.04); --series-1: #2a78d6;
  --cat-1: #2a78d6; --cat-2: #eb6834; --cat-3: #1baf7a; --cat-4: #eda100; --cat-5: #e87ba4; --cat-6: #008300; --cat-7: #4a3aa7; --cat-8: #e34948; --cat-rest: #898781;
  --status-good: #0ca30c; --status-warn: #fab219; --status-bad: #d03b3b;
}
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) {
  color-scheme: dark; --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #fff; --text-secondary: #c3c2b7; --text-muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --hover-wash: rgba(255,255,255,0.06); --series-1: #3987e5;
  --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500; --cat-5: #d55181; --cat-6: #008300; --cat-7: #9085e9; --cat-8: #e66767; --cat-rest: #898781; } }
:root[data-theme="dark"] {
  color-scheme: dark; --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #fff; --text-secondary: #c3c2b7; --text-muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --hover-wash: rgba(255,255,255,0.06); --series-1: #3987e5;
  --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500; --cat-5: #d55181; --cat-6: #008300; --cat-7: #9085e9; --cat-8: #e66767; --cat-rest: #898781; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text-primary); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.subtitle { color: var(--text-muted); font-size: 13px; } .spacer { flex: 1; }
.filters { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.filter-set { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .filter-label { font-size: 12px; color: var(--text-muted); }
.group { display: flex; gap: 2px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.group button { font: inherit; font-size: 13px; color: var(--text-secondary); background: none; border: 0; border-radius: 6px; padding: 5px 11px; cursor: pointer; }
.group button:hover { background: var(--hover-wash); } .group button[aria-pressed="true"] { background: var(--series-1); color: #fff; }
.group button:focus-visible, .icon-btn:focus-visible, .link:focus-visible, select:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.icon-btn { font: inherit; font-size: 13px; color: var(--text-secondary); cursor: pointer; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 11px; text-decoration: none; }
.icon-btn:hover { background: var(--hover-wash); }
select { font: inherit; font-size: 13px; color: var(--text-primary); cursor: pointer; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
.tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.tile .label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
.tile .value { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; } .tile .unit { font-size: 14px; font-weight: 400; color: var(--text-secondary); margin-left: 2px; }
.tile .sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 18px 18px 14px; margin-bottom: 16px; }
.card-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; } .card h2 { font-size: 14px; font-weight: 600; margin: 0; } .card .note { font-size: 12px; color: var(--text-muted); } .card .plot { margin-top: 14px; }
.stale { opacity: 0.45; transition: opacity 120ms ease; }
svg { display: block; width: 100%; overflow: visible; } svg text { fill: var(--text-muted); font-size: 11px; }
svg .tick-value { font-variant-numeric: tabular-nums; } svg .grid-line { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; } svg .axis-line { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
svg .hit { fill: transparent; cursor: pointer; outline: none; } svg .hit:focus-visible + .mark, svg .hit:hover + .mark { opacity: 0.78; }
svg .series { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg .pt { stroke: var(--surface-1); stroke-width: 2; } svg .pt.low { fill: var(--surface-1) !important; stroke-width: 2; }
svg .program { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; } svg .program-label { fill: var(--text-muted); font-size: 10px; }
svg .value-label { fill: var(--text-secondary); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .spark { fill: none; stroke: var(--series-1); stroke-width: 1.5; }
.tip { position: fixed; z-index: 10; pointer-events: none; opacity: 0; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.13); transition: opacity 90ms ease; max-width: 260px; }
.tip[data-show="1"] { opacity: 1; } .tip .tip-head { color: var(--text-muted); margin-bottom: 4px; }
.tip-row { display: flex; align-items: center; gap: 7px; white-space: nowrap; } .tip-row .v { font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; } .tip-row .k { color: var(--text-secondary); }
.tip-key { width: 10px; height: 2px; border-radius: 1px; background: var(--series-1); flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font-size: 12px; } .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); } .legend i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
table { width: 100%; border-collapse: collapse; font-size: 13px; } th, td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--border); }
th { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; } td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; padding-right: 0; } tbody tr:last-child td { border-bottom: 0; }
/* A right-aligned numeric column followed by a text column needs its own gap. */
td.num + td:not(.num), th.num + th:not(.num) { padding-left: 16px; }
.scroll { overflow-x: auto; }
.verdict { display: inline-flex; align-items: center; gap: 6px; } .verdict::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--grid); }
.verdict[data-v="progressing"]::before { background: var(--status-good); } .verdict[data-v="holding"]::before { background: var(--status-warn); } .verdict[data-v="regressing"]::before { background: var(--status-bad); }
.link { background: none; border: 0; padding: 0; font: inherit; font-size: 12px; color: var(--series-1); cursor: pointer; text-decoration: underline; }
.empty { color: var(--text-muted); padding: 28px 0; text-align: center; font-size: 13px; }
.gate { max-width: 400px; margin: 72px auto; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 22px; } .gate h2 { font-size: 15px; margin: 0 0 6px; } .gate p { color: var(--text-secondary); font-size: 13px; margin: 0 0 14px; }
.gate input { width: 100%; font: inherit; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--axis); background: var(--page); color: var(--text-primary); margin-bottom: 10px; }
.gate button { font: inherit; font-weight: 500; background: var(--series-1); color: #fff; border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; }
.err { color: #d03b3b; font-size: 12px; margin-top: 10px; } [hidden] { display: none !important; }

#app-splash { position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:#2a78d6; color:#fff; font:14px/1.5 system-ui,sans-serif; }
#app-splash img { width:112px; height:112px; border-radius:24px; }
#app-splash strong { font-size:22px; font-weight:600; } #app-splash small { font-size:13px; opacity:0.85; }

#app-splash img { animation:splash-swoop 1.1s cubic-bezier(0.22,0.7,0.3,1) both, splash-breathe 2s ease-in-out 1.1s infinite; }
.splash-dots { display:inline-flex; gap:4px; margin-left:6px; vertical-align:middle; }
.splash-dots i { display:block; width:4px; height:4px; border-radius:50%; background:currentColor; opacity:0.6; animation:splash-dot 1.2s ease-in-out infinite; }
.splash-dots i:nth-child(2) { animation-delay:0.15s; } .splash-dots i:nth-child(3) { animation-delay:0.3s; }
@keyframes splash-swoop {
  0% { transform:translate(calc(-50vw - 112px),calc(50vh + 112px)) rotate(-18deg) scale(0.75); opacity:0; }
  12% { opacity:1; }
  50% { transform:translate(calc(50vw - 80px),calc(-50vh + 124px)) rotate(10deg) scale(1.06); opacity:1; }
  78% { transform:translate(-8px,10px) rotate(-3deg) scale(0.98); opacity:1; }
  100% { transform:translate(0,0) rotate(0) scale(1); opacity:1; }
}
@keyframes splash-breathe { 0%,100% { transform:scale(1); opacity:0.9; } 50% { transform:scale(1.035); opacity:1; } }
@keyframes splash-dot { 0%,70%,100% { transform:translateY(0); opacity:0.35; } 35% { transform:translateY(-3px); opacity:1; } }
@media (prefers-reduced-motion:reduce) { #app-splash img, .splash-dots i { animation:none; } }
#app-splash[hidden] { display:none; }
#app-force-refresh { position:fixed; z-index:10000; right:max(16px,env(safe-area-inset-right)); bottom:max(16px,env(safe-area-inset-bottom)); min-height:44px; border:1px solid var(--border); border-radius:22px; padding:10px 14px; background:var(--surface-1); color:var(--text-primary); font:13px system-ui,sans-serif; box-shadow:0 2px 12px rgba(0,0,0,0.12); cursor:pointer; }
#app-force-refresh:focus-visible { outline:2px solid var(--series-1); outline-offset:3px; }
#app-force-refresh:disabled { opacity:0.7; cursor:wait; }
#app-refresh-status { position:fixed; z-index:10000; right:16px; bottom:76px; max-width:280px; padding:10px 14px; border-radius:8px; background:var(--surface-1); color:var(--text-primary); border:1px solid var(--border); font:13px/1.5 system-ui,sans-serif; }
.feed { display: flex; flex-direction: column; gap: 12px; }
.msg { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px 12px; scroll-margin-top: 16px; }
.msg.target { border-color: var(--series-1); box-shadow: 0 0 0 1px var(--series-1); }
.msg-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; font-size: 12px; color: var(--text-muted); }
.kind { font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; font-size: 11px; }
.msg-body { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
.msg-body code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; background: var(--hover-wash); border-radius: 4px; padding: 1px 4px; }
.msg-body code.block { display: block; padding: 8px 10px; margin: 4px 0; overflow-x: auto; white-space: pre; }
.msg-body a { color: var(--series-1); }
.msg-foot { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-top: 10px; font-size: 12px; color: var(--text-muted); }
.msg-foot a { color: var(--series-1); }
.delivery { display: inline-flex; align-items: center; gap: 6px; } .delivery::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--grid); }
.delivery[data-status="sent"]::before { background: var(--status-good); } .delivery[data-status="failed"]::before { background: var(--status-bad); }
.delivery[data-status="failed"] { color: var(--status-bad); }
.day { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin: 10px 0 -2px; }
.more { display: flex; justify-content: center; margin-top: 16px; }
</style>

<body>
<div id="app-splash" role="status" aria-label="Loading Workout Tracker">
  <img src="/api/app-assets/icon-v1-192.png" width="112" height="112" alt="">
  <strong>Workout Tracker</strong><small>Loading your training<span class="splash-dots" aria-hidden="true"><i></i><i></i><i></i></span></small>
</div>
<button id="app-force-refresh" type="button" title="Clear app caches and load the latest version. Your saved key stays on this device.">↻ Refresh app</button>
<div id="app-refresh-status" role="status" hidden></div>
<script>setTimeout(() => { document.getElementById("app-splash").hidden = true; }, 8000); document.getElementById("app-force-refresh").onclick = () => location.reload();</script>
<script src="/api/app-assets/app-shell.js" defer></script>
<noscript><style>#app-splash{display:none}</style></noscript>
<div class="wrap">
  <div id="gate" class="gate" hidden>
    <h2>API key</h2><p>Same key as the dashboard. Kept in this browser only.</p>
    <input id="gate-key" type="password" autocomplete="current-password" placeholder="x-api-key" spellcheck="false">
    <button id="gate-go" type="button">Open</button><div id="gate-err" class="err" hidden></div>
  </div>

  <div id="app" hidden>
    <header>
      <h1>Notifications</h1><span class="subtitle" id="span-label"></span><span class="spacer"></span>
      <a class="icon-btn" href="/api/dashboard">← Dashboard</a>
      <a class="icon-btn" href="/api/history">Workouts →</a>
      <button class="icon-btn" id="theme-toggle" type="button">Theme</button>
    </header>

    <div class="filters">
      <div class="filter-set"><span class="filter-label">Show</span>
        <div class="group" id="kind-group" role="group" aria-label="Kind of notification">
          <button type="button" data-kind="">All</button>
          <button type="button" data-kind="weekly">Weekly</button>
          <button type="button" data-kind="checkin">Check-ins</button>
          <button type="button" data-kind="milestones">Milestones</button>
          <button type="button" data-kind="stale">Alerts</button>
        </div></div>
    </div>

    <div class="feed" id="feed" aria-live="polite"></div>
    <div class="more"><button class="icon-btn" id="more" type="button" hidden>Load older</button></div>
    <div id="error" class="err" hidden></div>
  </div>
</div>

<script type="module">
"use strict";
const KEY_STORAGE = "workout-tracker.apiKey", THEME_STORAGE = "workout-tracker.theme";
const state = { key: "", items: [], next: undefined, kind: "", target: "" };
const KIND_LABEL = { weekly: "Weekly summary", checkin: "Thursday check-in", milestones: "Milestone", stale: "Alert" };
const LINK_LABEL = { "/api/dashboard": "Open dashboard", "/api/recovery": "Open recovery", "/api/history": "Open workouts" };
function readStored(n) { try { return localStorage.getItem(n) ?? ""; } catch { return ""; } }
function writeStored(n, v) { try { v ? localStorage.setItem(n, v) : localStorage.removeItem(n); } catch {} }
function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else e.setAttribute(k, v); }
  for (const c of children) if (c !== null && c !== undefined) e.append(c);
  return e;
}

/* The API's spans are the message — styled runs, no HTML to trust. A native app renders the same list. */
function renderSpans(input) {
  // A multi-line code span renders as a block, which already breaks the line: drop the newline either side of it.
  const spans = input.map((s) => ({ ...s }));
  spans.forEach((s, i) => {
    if (!s.code || !s.text.includes("\n")) return;
    if (spans[i - 1]?.text.endsWith("\n")) spans[i - 1].text = spans[i - 1].text.slice(0, -1);
    if (spans[i + 1]?.text.startsWith("\n")) spans[i + 1].text = spans[i + 1].text.slice(1);
  });
  const frag = document.createDocumentFragment();
  for (const s of spans) {
    let node = document.createTextNode(s.text);
    if (s.code) { const c = el("code", s.text.includes("\n") ? { class: "block" } : {}); c.append(node); node = c; }
    if (s.bold) { const b = el("strong"); b.append(node); node = b; }
    if (s.italic) { const i = el("em"); i.append(node); node = i; }
    if (s.underline) { const u = el("u"); u.append(node); node = u; }
    if (s.strike) { const x = el("s"); x.append(node); node = x; }
    if (s.href && /^https?:\/\//i.test(s.href)) { const a = el("a", { href: s.href, target: "_blank", rel: "noopener noreferrer" }); a.append(node); node = a; }
    frag.append(node);
  }
  return frag;
}

const when = (iso) => new Date(iso).toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const dayKey = (iso) => new Date(iso).toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" });

function card(n) {
  const deliveries = n.deliveries.length
    ? n.deliveries.map((d) => el("span", { class: "delivery", "data-status": d.status, title: d.error ?? "", text: d.status === "sent" ? `Sent to ${d.channel === "telegram" ? "Telegram" : d.channel}` : `${d.channel === "telegram" ? "Telegram" : d.channel} failed${d.error ? `: ${d.error}` : ""}` }))
    : [el("span", { class: "delivery", "data-status": "none", text: "Not delivered — no channel configured" })];
  return el("article", { class: n.id === state.target ? "msg target" : "msg", id: n.id, "aria-label": `${KIND_LABEL[n.kind] ?? n.kind}: ${n.title}` },
    el("div", { class: "msg-head" }, el("span", { class: "kind", text: KIND_LABEL[n.kind] ?? n.kind }), el("time", { datetime: n.createdAt, text: when(n.createdAt) })),
    el("div", { class: "msg-body" }, renderSpans(n.spans)),
    el("div", { class: "msg-foot" }, ...deliveries, el("a", { href: n.link, text: `${LINK_LABEL[n.link] ?? "Open"} →` }), el("a", { href: `#${n.id}`, text: "Link" })));
}

function render() {
  const shown = state.items.filter((n) => !state.kind || n.kind === state.kind);
  const feed = document.getElementById("feed");
  if (!shown.length) { feed.replaceChildren(el("div", { class: "empty", text: state.items.length ? "Nothing of this kind loaded yet." : "No notifications yet. Every message sent from now on appears here." })); }
  else {
    const nodes = []; let day = "";
    for (const n of shown) { const d = dayKey(n.createdAt); if (d !== day) { day = d; nodes.push(el("h2", { class: "day", text: d })); } nodes.push(card(n)); }
    feed.replaceChildren(...nodes);
  }
  document.getElementById("more").hidden = !state.next;
  const failed = state.items.filter((n) => n.deliveries.some((d) => d.status === "failed")).length;
  document.getElementById("span-label").textContent = `${state.items.length}${state.next ? "+" : ""} sent${failed ? ` · ${failed} failed to deliver` : ""}`;
}

async function fetchPage() {
  const q = new URLSearchParams({ limit: "50", ...(state.next ? { after: state.next } : {}) });
  const r = await fetch(`/api/notifications?${q}`, { headers: { "x-api-key": state.key } });
  if (r.status === 401) { signOut("That key was rejected."); return false; }
  if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
  const data = await r.json();
  state.items.push(...data.notifications); state.next = data.next;
  return true;
}

/* `#<id>` opens on one notification — what a push tap in the app would link to. Older pages load until it is found. */
async function focusTarget() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (!id) return;
  for (let i = 0; i < 10 && !state.items.some((n) => n.id === id) && state.next; i++) if (!(await fetchPage())) return;
  if (!state.items.some((n) => n.id === id)) return;
  state.target = id; state.kind = ""; selectKind(); render();
  document.getElementById(id)?.scrollIntoView({ block: "start" });
}

async function load() {
  const app = document.getElementById("app"), err = document.getElementById("error"); app.classList.add("stale"); err.hidden = true;
  try { state.items = []; state.next = undefined; if (await fetchPage()) { render(); await focusTarget(); } }
  catch (e) { err.textContent = `Could not load notifications: ${e.message}`; err.hidden = false; }
  finally { app.classList.remove("stale"); window.workoutAppReady = true; document.dispatchEvent(new Event("workout-app-ready")); }
}

function selectKind() { for (const b of document.querySelectorAll("#kind-group button")) b.setAttribute("aria-pressed", String(b.dataset.kind === state.kind)); }

function init() {
  const t = readStored(THEME_STORAGE); if (t) document.documentElement.setAttribute("data-theme", t);
  selectKind();
  document.getElementById("kind-group").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; state.kind = b.dataset.kind; selectKind(); render(); });
  document.getElementById("more").addEventListener("click", async (e) => { e.target.disabled = true; try { await fetchPage(); render(); } catch (x) { const err = document.getElementById("error"); err.textContent = `Could not load more: ${x.message}`; err.hidden = false; } finally { e.target.disabled = false; } });
  addEventListener("hashchange", () => { focusTarget(); });
  document.getElementById("theme-toggle").addEventListener("click", () => { const c = document.documentElement.getAttribute("data-theme"); const d = matchMedia("(prefers-color-scheme: dark)").matches; const n = c ? (c === "dark" ? "light" : "dark") : (d ? "light" : "dark"); document.documentElement.setAttribute("data-theme", n); writeStored(THEME_STORAGE, n); });
  document.getElementById("gate-go").addEventListener("click", () => { const v = document.getElementById("gate-key").value.trim(); if (v) start(v); });
  document.getElementById("gate-key").addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("gate-go").click(); });
  const fromUrl = new URL(location.href).searchParams.get("key"); if (fromUrl) history.replaceState(null, "", location.pathname + location.hash);
  const key = fromUrl || readStored(KEY_STORAGE); if (key) start(key); else signOut();
}
function signOut(msg) { window.workoutAppReady = true; document.dispatchEvent(new Event("workout-app-ready")); state.key = ""; writeStored(KEY_STORAGE, ""); document.getElementById("app").hidden = true; const g = document.getElementById("gate"); g.hidden = false; const e = document.getElementById("gate-err"); e.hidden = !msg; if (msg) e.textContent = msg; document.getElementById("gate-key").focus(); }
function start(key) { state.key = key; writeStored(KEY_STORAGE, key); document.getElementById("gate").hidden = true; document.getElementById("app").hidden = false; load(); }
init();
</script>
</body>
</html>
