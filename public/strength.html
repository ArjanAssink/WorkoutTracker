<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Strength</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface-1: #fcfcfb; --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --hover-wash: rgba(11,11,11,0.04); --series-1: #2a78d6;
  --cat-1: #2a78d6; --cat-2: #eb6834; --cat-3: #1baf7a; --cat-4: #eda100; --cat-5: #e87ba4; --cat-6: #008300; --cat-7: #4a3aa7; --cat-8: #e34948; --cat-rest: #898781;
  --status-good: #0ca30c; --status-warn: #fab219; --status-bad: #d03b3b;
}
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) {
  color-scheme: dark; --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #fff; --text-secondary: #c3c2b7; --text-muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --hover-wash: rgba(255,255,255,0.06); --series-1: #3987e5;
  --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500; --cat-5: #d55181; --cat-6: #008300; --cat-7: #9085e9; --cat-8: #e66767; --cat-rest: #898781; } }
:root[data-theme="dark"] {
  color-scheme: dark; --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #fff; --text-secondary: #c3c2b7; --text-muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --hover-wash: rgba(255,255,255,0.06); --series-1: #3987e5;
  --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500; --cat-5: #d55181; --cat-6: #008300; --cat-7: #9085e9; --cat-8: #e66767; --cat-rest: #898781; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text-primary); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.subtitle { color: var(--text-muted); font-size: 13px; } .spacer { flex: 1; }
.filters { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.filter-set { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .filter-label { font-size: 12px; color: var(--text-muted); }
.group { display: flex; gap: 2px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.group button { font: inherit; font-size: 13px; color: var(--text-secondary); background: none; border: 0; border-radius: 6px; padding: 5px 11px; cursor: pointer; }
.group button:hover { background: var(--hover-wash); } .group button[aria-pressed="true"] { background: var(--series-1); color: #fff; }
.group button:focus-visible, .icon-btn:focus-visible, .link:focus-visible, select:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.icon-btn { font: inherit; font-size: 13px; color: var(--text-secondary); cursor: pointer; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 11px; text-decoration: none; }
.icon-btn:hover { background: var(--hover-wash); }
select { font: inherit; font-size: 13px; color: var(--text-primary); cursor: pointer; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
.tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.tile .label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
.tile .value { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; } .tile .unit { font-size: 14px; font-weight: 400; color: var(--text-secondary); margin-left: 2px; }
.tile .sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 18px 18px 14px; margin-bottom: 16px; }
.card-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; } .card h2 { font-size: 14px; font-weight: 600; margin: 0; } .card .note { font-size: 12px; color: var(--text-muted); } .card .plot { margin-top: 14px; }
.stale { opacity: 0.45; transition: opacity 120ms ease; }
svg { display: block; width: 100%; overflow: visible; } svg text { fill: var(--text-muted); font-size: 11px; }
svg .tick-value { font-variant-numeric: tabular-nums; } svg .grid-line { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; } svg .axis-line { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
svg .hit { fill: transparent; cursor: pointer; outline: none; } svg .hit:focus-visible + .mark, svg .hit:hover + .mark { opacity: 0.78; }
svg .series { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg .pt { stroke: var(--surface-1); stroke-width: 2; } svg .pt.low { fill: var(--surface-1) !important; stroke-width: 2; }
svg .program { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; } svg .program-label { fill: var(--text-muted); font-size: 10px; }
svg .value-label { fill: var(--text-secondary); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .spark { fill: none; stroke: var(--series-1); stroke-width: 1.5; }
.tip { position: fixed; z-index: 10; pointer-events: none; opacity: 0; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.13); transition: opacity 90ms ease; max-width: 260px; }
.tip[data-show="1"] { opacity: 1; } .tip .tip-head { color: var(--text-muted); margin-bottom: 4px; }
.tip-row { display: flex; align-items: center; gap: 7px; white-space: nowrap; } .tip-row .v { font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; } .tip-row .k { color: var(--text-secondary); }
.tip-key { width: 10px; height: 2px; border-radius: 1px; background: var(--series-1); flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font-size: 12px; } .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); } .legend i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
table { width: 100%; border-collapse: collapse; font-size: 13px; } th, td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--border); }
th { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; } td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; padding-right: 0; } tbody tr:last-child td { border-bottom: 0; }
/* A right-aligned numeric column followed by a text column needs its own gap. */
td.num + td:not(.num), th.num + th:not(.num) { padding-left: 16px; }
.scroll { overflow-x: auto; }
.verdict { display: inline-flex; align-items: center; gap: 6px; } .verdict::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--grid); }
.verdict[data-v="progressing"]::before { background: var(--status-good); } .verdict[data-v="holding"]::before { background: var(--status-warn); } .verdict[data-v="regressing"]::before { background: var(--status-bad); }
.link { background: none; border: 0; padding: 0; font: inherit; font-size: 12px; color: var(--series-1); cursor: pointer; text-decoration: underline; }
.empty { color: var(--text-muted); padding: 28px 0; text-align: center; font-size: 13px; }
.gate { max-width: 400px; margin: 72px auto; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 22px; } .gate h2 { font-size: 15px; margin: 0 0 6px; } .gate p { color: var(--text-secondary); font-size: 13px; margin: 0 0 14px; }
.gate input { width: 100%; font: inherit; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--axis); background: var(--page); color: var(--text-primary); margin-bottom: 10px; }
.gate button { font: inherit; font-weight: 500; background: var(--series-1); color: #fff; border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; }
.err { color: #d03b3b; font-size: 12px; margin-top: 10px; } [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div id="gate" class="gate" hidden>
    <h2>API key</h2><p>Same key as the dashboard. Kept in this browser only.</p>
    <input id="gate-key" type="password" autocomplete="current-password" placeholder="x-api-key" spellcheck="false">
    <button id="gate-go" type="button">Open</button><div id="gate-err" class="err" hidden></div>
  </div>

  <div id="app" hidden>
    <header>
      <h1>Strength</h1><span class="subtitle" id="span-label"></span><span class="spacer"></span>
      <a class="icon-btn" href="/api/dashboard">← Dashboard</a>
      <a class="icon-btn" href="/api/recovery">Recovery →</a>
      <button class="icon-btn" id="theme-toggle" type="button">Theme</button>
    </header>

    <div class="filters">
      <div class="filter-set"><span class="filter-label">Family</span><div class="group" id="family-group" role="group" aria-label="Lift family"></div></div>
      <div class="filter-set"><span class="filter-label">Measure</span>
        <div class="group" id="measure-group" role="group" aria-label="Measure">
          <button type="button" data-measure="e1rm">kg (e1RM)</button>
          <button type="button" data-measure="relative">× bodyweight</button>
          <button type="button" data-measure="dots">DOTS</button>
        </div></div>
      <div class="filter-set"><span class="filter-label">Since</span>
        <div class="group" id="range-group" role="group" aria-label="Time range">
          <button type="button" data-range="all">All</button>
          <button type="button" data-range="5">5 y</button>
          <button type="button" data-range="2">2 y</button>
          <button type="button" data-range="1">1 y</button>
        </div></div>
      <div class="filter-set"><span class="filter-label">Estimate</span>
        <div class="group" id="estimator-group" role="group" aria-label="Estimator">
          <button type="button" data-est="personal">Your curve</button>
          <button type="button" data-est="wendler">Wendler</button>
        </div></div>
    </div>

    <div id="kpis" class="kpis"></div>

    <div class="card">
      <div class="card-head"><h2 id="pr-title">Estimated 1RM over time</h2><span class="note" id="pr-note"></span></div>
      <div class="plot" id="pr-chart"></div>
      <div class="legend" id="pr-legend"></div>
      <button class="link" id="toggle-pr-table" type="button" style="margin-top:10px">Show data table</button>
      <div id="pr-table" hidden style="margin-top:12px"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Rep-max board</h2><span class="note" id="repmax-note"></span></div>
      <div class="scroll" id="repmax"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Block tracker</h2><span class="note" id="block-note"></span><span class="spacer"></span><select id="block-select" aria-label="Training block"></select></div>
      <div class="scroll" id="block"></div>
    </div>

    <div id="error" class="err" hidden></div>
  </div>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>

<script type="module">
"use strict";
const KEY_STORAGE = "workout-tracker.apiKey", THEME_STORAGE = "workout-tracker.theme";
const state = { key: "", data: null, family: "squat", measure: "e1rm", estimator: "personal", range: "all", block: null };
/* The chart and its table obey the range; the tiles are all-time, since "best" means best ever. */
function rangeStart() { if (state.range === "all") return ""; const d = new Date(); d.setUTCFullYear(d.getUTCFullYear() - Number(state.range)); return d.toISOString().slice(0, 10); }
const inRange = (p) => p.date >= rangeStart();
function readStored(n) { try { return localStorage.getItem(n) ?? ""; } catch { return ""; } }
function writeStored(n, v) { try { v ? localStorage.setItem(n, v) : localStorage.removeItem(n); } catch {} }

/* Fixed colour per lift, never by rank: the same lift keeps its hue across families and filters. */
const SLOTS = { squat: 1, bench: 2, deadlift: 3, ohp: 4, "ssb-squat": 5, "buffalo-bench": 6, "close-grip-bench": 7, rdl: 8, "pull-up": 7, "chin-up": 8, "ssb-squat-upright": 7, "bulgarian-split-squat": 8, "sg-rdl": 6, "t-bar-row": 7 };
const color = (slug) => (SLOTS[slug] ? `var(--cat-${SLOTS[slug]})` : "var(--cat-rest)");
const FAMILY_LABEL = { squat: "Squat", bench: "Bench", deadlift: "Deadlift", press: "Press", pull: "Pull-up", row: "Row", other: "Other" };
/* A pull-up's numbers are the added load; the body is the rest of the bar. */
const setText = (p) => `${p.loadKg !== undefined ? "+" : ""}${p.kg} kg × ${p.reps}${p.rir !== undefined ? ` @ ${p.rir} RIR` : ""}`;
const MEASURE = {
  e1rm:     { label: "estimated 1RM", unit: "kg", fmt: (v) => `${v.toFixed(1)} kg`, axis: (v) => `${Math.round(v)}` },
  relative: { label: "× bodyweight",  unit: "×",  fmt: (v) => `${v.toFixed(2)}×`,   axis: (v) => v.toFixed(1) },
  dots:     { label: "DOTS",          unit: "",   fmt: (v) => v.toFixed(1),         axis: (v) => `${Math.round(v)}` },
};

/* ---- svg helpers ---- */
const NS = "http://www.w3.org/2000/svg";
function svgEl(n, a = {}) { const e = document.createElementNS(NS, n); for (const [k, v] of Object.entries(a)) e.setAttribute(k, String(v)); return e; }
function svgText(x, y, t, a = {}) { const e = svgEl("text", { x, y, ...a }); e.appendChild(document.createTextNode(t)); return e; }
function niceTicks(lo, hi, count = 4) {
  const span = Math.max(1e-9, hi - lo), raw = span / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw) ?? 10 * mag;
  const start = Math.floor(lo / step) * step, end = Math.ceil(hi / step) * step; const t = [];
  for (let v = start; v <= end + step * 1e-6; v += step) t.push(Math.round(v * 1e6) / 1e6); return t;
}
const tip = document.getElementById("tip");
function showTip(e, head, rows) {
  tip.replaceChildren(); const h = document.createElement("div"); h.className = "tip-head"; h.textContent = head; tip.appendChild(h);
  for (const [k, v, c] of rows) { const r = document.createElement("div"); r.className = "tip-row"; const key = document.createElement("span"); key.className = "tip-key"; if (c) key.style.background = c; else key.style.visibility = "hidden";
    const vv = document.createElement("span"); vv.className = "v"; vv.textContent = v; const kk = document.createElement("span"); kk.className = "k"; kk.textContent = k; r.append(key, vv, kk); tip.appendChild(r); }
  tip.dataset.show = "1"; positionTip(e);
}
function positionTip(e) { const b = e.target.getBoundingClientRect(), t = tip.getBoundingClientRect(); let x = (e.clientX ?? b.left + b.width / 2) + 12, y = (e.clientY ?? b.top) - t.height - 10; if (x + t.width > innerWidth - 8) x = innerWidth - t.width - 8; if (y < 8) y = (e.clientY ?? b.bottom) + 16; tip.style.left = `${Math.max(8, x)}px`; tip.style.top = `${y}px`; }
const hideTip = () => { tip.dataset.show = "0"; };
function attachTip(hit, head, rows) { hit.setAttribute("tabindex", "0"); hit.setAttribute("role", "img"); hit.setAttribute("aria-label", `${head}: ${rows.map(([k, v]) => `${v} ${k}`).join(", ")}`);
  hit.addEventListener("pointerenter", (e) => showTip(e, head, rows)); hit.addEventListener("pointermove", positionTip); hit.addEventListener("pointerleave", hideTip); hit.addEventListener("focus", (e) => showTip(e, head, rows)); hit.addEventListener("blur", hideTip); }
function buildTable(headers, rows) {
  const t = document.createElement("table"), th = document.createElement("thead"), hr = document.createElement("tr");
  for (const h of headers) { const c = document.createElement("th"); const s = typeof h === "string" ? { text: h } : h; if (s.num) c.className = "num"; c.textContent = s.text; hr.appendChild(c); }
  th.appendChild(hr); const tb = document.createElement("tbody");
  for (const r of rows) { const tr = document.createElement("tr"); for (const cell of r) { const td = document.createElement("td"); const s = typeof cell === "string" ? { text: cell } : cell; if (s.num) td.className = "num"; if (s.el) td.appendChild(s.el); else td.textContent = s.text; tr.appendChild(td); } tb.appendChild(tr); }
  t.append(th, tb); return t;
}
const fmtDate = (iso, opts = { month: "short", year: "numeric" }) => new Date(`${iso}T12:00:00Z`).toLocaleDateString(undefined, { ...opts, timeZone: "UTC" });
function emptyNote(t) { const d = document.createElement("div"); d.className = "empty"; d.textContent = t; return d; }

/* ---- value of a point under the current measure/estimator ---- */
function valueOf(p) {
  const e1 = state.estimator === "wendler" ? p.e1rmWendler : p.e1rm;
  if (state.measure === "e1rm") return e1;
  if (!p.bodyweightKg) return undefined;
  // Relative and DOTS are recomputed from the chosen estimator so the toggles compose.
  if (state.measure === "relative") return e1 / p.bodyweightKg;
  const bw = Math.min(Math.max(p.bodyweightKg, 40), 210), c = [-307.75076, 24.0900756, -0.1918759221, 0.0007391293, -0.000001093];
  return (e1 * 500) / (c[0] + c[1] * bw + c[2] * bw ** 2 + c[3] * bw ** 3 + c[4] * bw ** 4);
}

/* ---- KPIs ---- */
function renderKpis() {
  const host = document.getElementById("kpis"); const series = state.data.prs.filter((s) => s.lift.family === state.family);
  const tiles = [];
  for (const s of series) {
    const pts = s.points.map((p) => ({ ...p, v: valueOf(p) })).filter((p) => p.v !== undefined); if (!pts.length) continue;
    // "Best" means a set taken to failure; a block's RIR-capped sets only stand in when there is nothing else,
    // but when one of them implies more than the best real attempt, the tile says so.
    const toFailure = pts.filter((p) => !p.submax); const best = (toFailure.length ? toFailure : pts).reduce((b, p) => (p.v > b.v ? p : b)); const last = pts[pts.length - 1];
    const floor = pts.filter((p) => p.submax && p.v > best.v).reduce((b, p) => (!b || p.v > b.v ? p : b), null);
    tiles.push({ label: `${s.lift.label} · best`, value: MEASURE[state.measure].fmt(best.v), sub: `${setText(best)} · ${fmtDate(best.date)}${best.lowConfidence ? " · high-rep estimate" : ""}${floor ? ` · a block set implies ${MEASURE[state.measure].fmt(floor.v)}` : ""}` });
    tiles.push({ label: `${s.lift.label} · latest`, value: MEASURE[state.measure].fmt(last.v), sub: `${setText(last)} · ${fmtDate(last.date)} · ${(last.v / best.v * 100).toFixed(0)}% of best${last.submax ? " · not to failure" : ""}` });
  }
  host.replaceChildren(...tiles.map((t) => { const el = document.createElement("div"); el.className = "tile"; const l = document.createElement("div"); l.className = "label"; l.textContent = t.label; const v = document.createElement("div"); v.className = "value"; v.textContent = t.value; const s = document.createElement("div"); s.className = "sub"; s.textContent = t.sub; el.append(l, v, s); return el; }));
}

/* ---- PR chart: one line per lift in the family, points hollow when high-rep, diamonds when stopped short of failure ---- */
const diamond = (cx, cy, r) => `M${cx},${cy - r}L${cx + r},${cy}L${cx},${cy + r}L${cx - r},${cy}Z`;
function renderPr() {
  const host = document.getElementById("pr-chart"), note = document.getElementById("pr-note"), legend = document.getElementById("pr-legend");
  const m = MEASURE[state.measure];
  document.getElementById("pr-title").textContent = `${m.label} over time — ${FAMILY_LABEL[state.family]}${state.family === "pull" ? " (added load)" : ""}`;
  const series = state.data.prs.filter((s) => s.lift.family === state.family).map((s) => ({ ...s, pts: s.points.filter(inRange).map((p) => ({ ...p, v: valueOf(p) })).filter((p) => p.v !== undefined) })).filter((s) => s.pts.length);
  if (!series.length) { host.replaceChildren(emptyNote(state.measure === "e1rm" ? "No PR entries for this family." : "No entries with a bodyweight to normalise against.")); legend.replaceChildren(); note.textContent = ""; return; }
  const all = series.flatMap((s) => s.pts);
  const width = Math.max(320, host.clientWidth || 640), padL = 50, padR = 14, padT = 26, xAxis = 26, plotH = 240, height = plotH + padT + xAxis;
  const svg = svgEl("svg", { viewBox: `0 0 ${width} ${height}`, height, role: "presentation" });
  const t0 = Math.min(...all.map((p) => Date.parse(p.date))), t1 = Math.max(...all.map((p) => Date.parse(p.date)));
  const pad = Math.max(1, (t1 - t0) * 0.02); const x = (t) => padL + ((t - (t0 - pad)) / ((t1 + pad) - (t0 - pad))) * (width - padL - padR);
  // Padded below the data but never below zero: nobody has lifted a negative kilogram.
  const vmin = Math.min(...all.map((p) => p.v)), vmax = Math.max(...all.map((p) => p.v)); const ticks = niceTicks(Math.max(0, vmin - (vmax - vmin) * 0.1), vmax + (vmax - vmin) * 0.1);
  const lo = ticks[0], hi = ticks[ticks.length - 1]; const y = (v) => padT + plotH - ((v - lo) / (hi - lo)) * plotH;
  for (const t of ticks) { svg.appendChild(svgEl("line", { class: t === lo ? "axis-line" : "grid-line", x1: padL, x2: width - padR, y1: y(t), y2: y(t) })); svg.appendChild(svgText(padL - 8, y(t) + 4, m.axis(t), { class: "tick-value", "text-anchor": "end" })); }
  const years = []; for (let yr = new Date(t0).getUTCFullYear(); yr <= new Date(t1).getUTCFullYear(); yr++) years.push(yr);
  const every = Math.max(1, Math.ceil((years.length * 40) / (width - padL - padR)));
  years.forEach((yr, i) => { if (i % every === 0) svg.appendChild(svgText(x(Date.UTC(yr, 0, 1)), padT + plotH + 17, `${yr}`, { "text-anchor": "middle" })); });
  // Program changes, from whichever series carries them: a hairline and a label, thinned to fit.
  const programs = []; let lastP; for (const p of all.sort((a, b) => a.date.localeCompare(b.date))) { if (p.program && p.program !== lastP) { programs.push(p); lastP = p.program; } }
  let lastLabelX = -Infinity; for (const p of programs) { const px = x(Date.parse(p.date)); svg.appendChild(svgEl("line", { class: "program", x1: px, x2: px, y1: padT - 4, y2: padT + plotH })); if (px - lastLabelX > 70) { svg.appendChild(svgText(px + 3, padT - 8, p.program.slice(0, 18), { class: "program-label" })); lastLabelX = px; } }
  for (const s of series) {
    const c = color(s.lift.slug); const d = s.pts.map((p, i) => `${i ? "L" : "M"}${x(Date.parse(p.date)).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
    svg.appendChild(svgEl("path", { class: "series", style: `stroke:${c}`, d }));
    for (const p of s.pts) {
      const cx = x(Date.parse(p.date)), cy = y(p.v);
      const hit = svgEl("circle", { class: "hit", cx, cy, r: 12 }); svg.appendChild(hit);
      const style = `fill:${c}; stroke:${p.lowConfidence ? c : "var(--surface-1)"}`;
      svg.appendChild(p.submax ? svgEl("path", { class: `pt mark${p.lowConfidence ? " low" : ""}`, d: diamond(cx, cy, 6), style }) : svgEl("circle", { class: `pt mark${p.lowConfidence ? " low" : ""}`, cx, cy, r: 4.5, style }));
      attachTip(hit, `${s.lift.label} · ${fmtDate(p.date, { day: "numeric", month: "short", year: "numeric" })}`, [
        [m.label, m.fmt(p.v), c], ["set", setText(p), null],
        ...(p.loadKg !== undefined ? [["on the bar", `${p.loadKg} kg incl. body`, null]] : []),
        [p.estimator === "personal" ? "e1RM (your curve)" : "e1RM (Wendler)", `${p.loadKg !== undefined ? "+" : ""}${(state.estimator === "wendler" ? p.e1rmWendler : p.e1rm).toFixed(1)} kg`, null],
        ...(p.bodyweightKg ? [["bodyweight" + (p.bodyweightSource === "sheet" ? " (sheet)" : ""), `${p.bodyweightKg} kg`, null]] : []),
        ...(p.session ? [["session", p.session, null]] : []), ...(p.program ? [["program", p.program, null]] : []),
        ...(p.submax ? [["note", `not to failure — read as ${p.reps + p.rir} reps`, null]] : []), ...(p.lowConfidence ? [["note", "11+ reps: extrapolated", null]] : [])]);
    }
    const last = s.pts[s.pts.length - 1]; svg.appendChild(svgText(x(Date.parse(last.date)) + 8, y(last.v) + 4, m.fmt(last.v), { class: "value-label" }));
  }
  host.replaceChildren(svg);
  legend.replaceChildren(...(series.length > 1 ? series.map((s) => { const i = document.createElement("span"); const sw = document.createElement("i"); sw.style.background = color(s.lift.slug); const t = document.createElement("span"); t.textContent = s.lift.label; i.append(sw, t); return i; }) : []));
  const hollow = all.filter((p) => p.lowConfidence).length, sub = all.filter((p) => p.submax).length;
  note.textContent = `${all.length} entries${hollow ? ` · ${hollow} hollow = 11+ reps, extrapolated` : ""}${sub ? ` · ${sub} ◆ = stopped short of failure, read as reps + RIR` : ""} · ${state.estimator === "personal" ? "your rep curve where fitted, Wendler elsewhere" : "Wendler for every point"}`;
  if (!document.getElementById("pr-table").hidden) renderPrTable();
}
function renderPrTable() {
  const series = state.data.prs.filter((s) => s.lift.family === state.family); const rows = series.flatMap((s) => s.points.filter(inRange).map((p) => ({ s, p }))).sort((a, b) => b.p.date.localeCompare(a.p.date));
  document.getElementById("pr-table").replaceChildren(buildTable(["Date", "Lift", "Set", { text: "e1RM (yours)", num: true }, { text: "e1RM (Wendler)", num: true }, { text: "BW", num: true }, { text: "× BW", num: true }, { text: "DOTS", num: true }, "Program"],
    rows.map(({ s, p }) => [fmtDate(p.date, { day: "numeric", month: "short", year: "numeric" }), s.lift.label, setText(p), { text: p.e1rm.toFixed(1), num: true }, { text: p.e1rmWendler.toFixed(1), num: true }, { text: p.bodyweightKg ? `${p.bodyweightKg}` : "—", num: true }, { text: p.relative ? p.relative.toFixed(2) : "—", num: true }, { text: p.dots ? p.dots.toFixed(1) : "—", num: true }, p.program ?? ""])));
}

/* ---- rep-max board ---- */
function renderRepMax() {
  const host = document.getElementById("repmax"), note = document.getElementById("repmax-note");
  const board = state.data.repMax.filter((b) => b.lift.family === state.family || state.family === "all");
  if (!board.length) { host.replaceChildren(emptyNote("No rep maxes recorded for this family.")); note.textContent = ""; return; }
  const reps = [...new Set(board.flatMap((b) => b.points.map((p) => p.reps)))].sort((a, b) => a - b);
  const rows = board.map((b) => [b.lift.label, ...reps.map((r) => { const p = b.points.find((q) => q.reps === r); return { text: p ? `${p.kg}` : "", num: true }; }),
    { text: `${b.best.e1rm.toFixed(1)}`, num: true }, { text: b.curve ? `k=${b.curve.k.toFixed(4)} (${b.curve.points} pts)` : "Wendler (too few points)", num: false }]);
  host.replaceChildren(buildTable(["Lift", ...reps.map((r) => ({ text: `${r}RM`, num: true })), { text: "Best e1RM", num: true }, "Curve"], rows));
  note.textContent = `kg at each rep count · as of ${fmtDate(board[0].asOf, { day: "numeric", month: "short", year: "numeric" })} · Wendler's k is 0.0333; a smaller k means your reps cost less`;
}

/* ---- block tracker: a table with a sparkline per lift ---- */
function spark(tm) {
  const w = 120, h = 28; const vals = tm.map((v, i) => ({ v, i })).filter((x) => x.v != null); if (vals.length < 2) return document.createTextNode("");
  const lo = Math.min(...vals.map((x) => x.v)), hi = Math.max(...vals.map((x) => x.v)); const y = (v) => hi === lo ? h / 2 : 3 + (h - 6) * (1 - (v - lo) / (hi - lo));
  const svg = svgEl("svg", { viewBox: `0 0 ${w} ${h}`, width: w, height: h, style: `width:${w}px`, role: "img", "aria-label": `${vals[0].v} to ${vals[vals.length - 1].v} kg over ${tm.length} weeks` });
  svg.appendChild(svgEl("path", { class: "spark", d: vals.map((x, k) => `${k ? "L" : "M"}${(x.i / Math.max(1, tm.length - 1) * (w - 4) + 2).toFixed(1)},${y(x.v).toFixed(1)}`).join("") }));
  return svg;
}
function renderBlock() {
  const host = document.getElementById("block"), note = document.getElementById("block-note"), select = document.getElementById("block-select");
  const blocks = state.data.blocks;
  if (!blocks.length) { host.replaceChildren(emptyNote("No training blocks imported.")); note.textContent = ""; select.hidden = true; return; }
  select.hidden = false; select.replaceChildren(...blocks.map((b) => { const o = document.createElement("option"); o.value = b.program; o.textContent = `${b.program} · from ${fmtDate(b.start)}`; return o; }));
  const block = blocks.find((b) => b.program === state.block) ?? blocks[blocks.length - 1]; select.value = block.program; state.block = block.program;
  const lifts = block.lifts.filter((l) => state.family === "all" || l.lift.family === state.family || !blocks.some(() => true));
  const shown = lifts.length ? lifts : block.lifts;
  const v = (s) => { const el = document.createElement("span"); el.className = "verdict"; el.dataset.v = s.verdict; el.textContent = s.verdict; return el; };
  host.replaceChildren(buildTable(["Lift", "Training max by week", { text: "First", num: true }, { text: "Last", num: true }, { text: "Change", num: true }, { text: "Recent /wk", num: true }, { text: "Since ↑", num: true }, "Verdict"],
    shown.map((s) => [s.lift.label, { el: spark(s.tmByWeek) }, { text: `${s.firstKg}`, num: true }, { text: `${s.lastKg}`, num: true }, { text: `${s.changePct >= 0 ? "+" : ""}${s.changePct.toFixed(1)}%`, num: true },
      { text: `${s.recentSlopePerWeek >= 0 ? "+" : ""}${(s.recentSlopePerWeek * 100).toFixed(1)}%`, num: true }, { text: s.weeksSinceIncrease ? `${s.weeksSinceIncrease} wk` : "—", num: true }, { el: v(s) }])));
  const prog = shown.filter((s) => s.verdict === "progressing").length;
  note.textContent = `${block.weeks} weeks · ${shown.length} lifts${lifts.length ? ` in ${FAMILY_LABEL[state.family]}` : ""} · ${prog} progressing · recent = change per trained week over the last 4`;
}

/* ---- orchestration ---- */
function renderAll() {
  const prs = state.data.prs; const first = prs.flatMap((s) => s.points).map((p) => p.date).sort();
  document.getElementById("span-label").textContent = first.length ? `${fmtDate(first[0])} – ${fmtDate(first[first.length - 1])} · ${state.data.weightsJoined} entries matched to a weigh-in` : "";
  renderKpis(); renderPr(); renderRepMax(); renderBlock();
}
async function load() {
  const app = document.getElementById("app"), err = document.getElementById("error"); app.classList.add("stale"); err.hidden = true;
  try {
    const r = await fetch("/api/lifts", { headers: { "x-api-key": state.key } });
    if (r.status === 401) { signOut("That key was rejected."); return; }
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    state.data = await r.json();
    const families = [...new Set([...state.data.prs.map((s) => s.lift.family), ...state.data.repMax.map((b) => b.lift.family), ...state.data.blocks.flatMap((b) => b.lifts.map((l) => l.lift.family))])];
    const order = ["squat", "bench", "deadlift", "press", "pull", "row", "other"]; const present = order.filter((f) => families.includes(f));
    if (!present.includes(state.family)) state.family = present[0] ?? "squat";
    wireGroup("family-group", present.map((f) => [f, FAMILY_LABEL[f]]), "family", (v) => { state.family = v; renderAll(); });
    renderAll();
  } catch (e) { err.textContent = `Could not load lifts: ${e.message}`; err.hidden = false; }
  finally { app.classList.remove("stale"); }
}
function wireGroup(id, options, attr, onPick) {
  const g = document.getElementById(id); if (options) g.replaceChildren(...options.map(([v, l]) => { const b = document.createElement("button"); b.type = "button"; b.dataset[attr] = v; b.textContent = l; return b; }));
  const sel = (v) => { for (const b of g.querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset[attr] === v)); };
  if (!g.dataset.wired) { g.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; sel(b.dataset[attr]); onPick(b.dataset[attr]); }); g.dataset.wired = "1"; }
  sel(state[attr === "est" ? "estimator" : attr]);
}
function init() {
  const t = readStored(THEME_STORAGE); if (t) document.documentElement.setAttribute("data-theme", t);
  wireGroup("measure-group", null, "measure", (v) => { state.measure = v; renderKpis(); renderPr(); });
  wireGroup("estimator-group", null, "est", (v) => { state.estimator = v; renderKpis(); renderPr(); });
  wireGroup("range-group", null, "range", (v) => { state.range = v; renderPr(); });
  document.getElementById("block-select").addEventListener("change", (e) => { state.block = e.target.value; renderBlock(); });
  document.getElementById("toggle-pr-table").addEventListener("click", (e) => { const p = document.getElementById("pr-table"); p.hidden = !p.hidden; e.target.textContent = p.hidden ? "Show data table" : "Hide data table"; if (!p.hidden) renderPrTable(); });
  document.getElementById("theme-toggle").addEventListener("click", () => { const c = document.documentElement.getAttribute("data-theme"); const d = matchMedia("(prefers-color-scheme: dark)").matches; const n = c ? (c === "dark" ? "light" : "dark") : (d ? "light" : "dark"); document.documentElement.setAttribute("data-theme", n); writeStored(THEME_STORAGE, n); });
  document.getElementById("gate-go").addEventListener("click", () => { const v = document.getElementById("gate-key").value.trim(); if (v) start(v); });
  document.getElementById("gate-key").addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("gate-go").click(); });
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (state.data) renderPr(); }, 120); });
  const fromUrl = new URL(location.href).searchParams.get("key"); if (fromUrl) history.replaceState(null, "", location.pathname);
  const key = fromUrl || readStored(KEY_STORAGE); if (key) start(key); else signOut();
}
function signOut(msg) { state.key = ""; writeStored(KEY_STORAGE, ""); document.getElementById("app").hidden = true; const g = document.getElementById("gate"); g.hidden = false; const e = document.getElementById("gate-err"); e.hidden = !msg; if (msg) e.textContent = msg; document.getElementById("gate-key").focus(); }
function start(key) { state.key = key; writeStored(KEY_STORAGE, key); document.getElementById("gate").hidden = true; document.getElementById("app").hidden = false; load(); }
init();
</script>
</body>
