<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Routes</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface-1: #fcfcfb; --canvas: #14130f; --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --hover-wash: rgba(11,11,11,0.04); --series-1: #2a78d6;
  --cat-1: #2a78d6; --cat-2: #eb6834; --cat-3: #1baf7a; --cat-4: #eda100; --cat-5: #e87ba4; --cat-7: #4a3aa7; --cat-rest: #898781; --glow: #f0a35c;
}
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) {
  color-scheme: dark; --page: #0d0d0d; --surface-1: #1a1a19; --canvas: #0b0b0b; --text-primary: #fff; --text-secondary: #c3c2b7; --text-muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --hover-wash: rgba(255,255,255,0.06); --series-1: #3987e5;
  --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500; --cat-5: #d55181; --cat-7: #9085e9; --cat-rest: #898781; } }
:root[data-theme="dark"] {
  color-scheme: dark; --page: #0d0d0d; --surface-1: #1a1a19; --canvas: #0b0b0b; --text-primary: #fff; --text-secondary: #c3c2b7; --text-muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --hover-wash: rgba(255,255,255,0.06); --series-1: #3987e5;
  --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500; --cat-5: #d55181; --cat-7: #9085e9; --cat-rest: #898781; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text-primary); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; } .subtitle { color: var(--text-muted); font-size: 13px; } .spacer { flex: 1; }
.filters { display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.filter-set { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .filter-label { font-size: 12px; color: var(--text-muted); }
.group { display: flex; gap: 2px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.group button { font: inherit; font-size: 13px; color: var(--text-secondary); background: none; border: 0; border-radius: 6px; padding: 5px 11px; cursor: pointer; }
.group button:hover { background: var(--hover-wash); } .group button[aria-pressed="true"] { background: var(--series-1); color: #fff; }
.group button:focus-visible, .icon-btn:focus-visible, .link:focus-visible, .card:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.icon-btn { font: inherit; font-size: 13px; color: var(--text-secondary); cursor: pointer; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 11px; text-decoration: none; }
.icon-btn:hover { background: var(--hover-wash); }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 18px 18px 14px; margin-bottom: 16px; }
.card-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; } .card h2 { font-size: 14px; font-weight: 600; margin: 0; } .card .note { font-size: 12px; color: var(--text-muted); }
.hero { position: relative; margin-top: 12px; } .hero canvas { display: block; width: 100%; border-radius: 10px; background: var(--canvas); cursor: grab; touch-action: none; } .hero canvas.dragging { cursor: grabbing; }
.hero .tag { position: absolute; left: 12px; top: 10px; background: rgba(0,0,0,0.55); color: #ddd; padding: 4px 9px; border-radius: 6px; font-size: 12px; pointer-events: none; }
.hero .hint { position: absolute; right: 12px; bottom: 10px; color: rgba(255,255,255,0.45); font-size: 11px; pointer-events: none; }
.places { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-top: 12px; }
.place { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 8px; cursor: pointer; text-align: left; font: inherit; color: inherit; }
.place:hover { background: var(--hover-wash); } .place canvas { display: block; width: 100%; border-radius: 4px; background: var(--canvas); }
.place b { display: block; font-size: 12px; color: var(--text-primary); margin-top: 6px; font-weight: 600; } .place .l { font-size: 11px; color: var(--text-muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font-size: 12px; } .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); } .legend i { width: 14px; height: 3px; border-radius: 2px; flex: none; }
.stale { opacity: 0.45; transition: opacity 120ms ease; }
.tip { position: fixed; z-index: 10; pointer-events: none; opacity: 0; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.13); transition: opacity 90ms ease; max-width: 260px; }
.tip[data-show="1"] { opacity: 1; } .tip .tip-head { color: var(--text-muted); margin-bottom: 4px; } .tip-row { display: flex; gap: 7px; white-space: nowrap; } .tip-row .v { font-weight: 600; color: var(--text-primary); } .tip-row .k { color: var(--text-secondary); }
table { width: 100%; border-collapse: collapse; font-size: 13px; } th, td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--border); }
th { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; } td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; padding-right: 0; } tbody tr:last-child td { border-bottom: 0; }
td.num + td:not(.num), th.num + th:not(.num) { padding-left: 16px; } .scroll { overflow-x: auto; }
.link { background: none; border: 0; padding: 0; font: inherit; font-size: 12px; color: var(--series-1); cursor: pointer; text-decoration: underline; }
.empty { color: var(--text-muted); padding: 28px 0; text-align: center; font-size: 13px; }
.gate { max-width: 400px; margin: 72px auto; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 22px; } .gate h2 { font-size: 15px; margin: 0 0 6px; } .gate p { color: var(--text-secondary); font-size: 13px; margin: 0 0 14px; }
.gate input { width: 100%; font: inherit; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--axis); background: var(--page); color: var(--text-primary); margin-bottom: 10px; }
.gate button { font: inherit; font-weight: 500; background: var(--series-1); color: #fff; border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; }
.err { color: #d03b3b; font-size: 12px; margin-top: 10px; } [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div id="gate" class="gate" hidden>
    <h2>API key</h2><p>Same key as the dashboard. Kept in this browser only.</p>
    <input id="gate-key" type="password" autocomplete="current-password" placeholder="x-api-key" spellcheck="false">
    <button id="gate-go" type="button">Open</button><div id="gate-err" class="err" hidden></div>
  </div>

  <div id="app" hidden>
    <header>
      <h1>Routes</h1><span class="subtitle" id="span-label"></span><span class="spacer"></span>
      <a class="icon-btn" href="/api/dashboard">← Dashboard</a>
      <button class="icon-btn" id="theme-toggle" type="button">Theme</button>
    </header>

    <div class="filters">
      <div class="filter-set"><span class="filter-label">Colour</span>
        <div class="group" id="colour-group" role="group" aria-label="Colour">
          <button type="button" data-colour="glow">One hue</button>
          <button type="button" data-colour="activity">By activity</button>
        </div></div>
      <div class="filter-set"><span class="filter-label">Activities</span><div class="group" id="activity-group" role="group" aria-label="Activities"></div></div>
      <div class="filter-set"><span class="filter-label">Since</span>
        <div class="group" id="range-group" role="group" aria-label="Time range">
          <button type="button" data-range="all">All</button>
          <button type="button" data-range="3">3 y</button>
          <button type="button" data-range="1">1 y</button>
        </div></div>
    </div>

    <div class="card">
      <div class="card-head"><h2 id="hero-title">Home</h2><span class="note" id="hero-note"></span><span class="spacer"></span><button class="icon-btn" id="back-home" type="button" hidden>← Home</button></div>
      <div class="hero"><canvas id="hero"></canvas><div class="tag" id="hero-tag"></div><div class="hint">drag to pan · wheel to zoom · hover a route</div></div>
      <div class="legend" id="legend"></div>
      <button class="link" id="toggle-table" type="button" style="margin-top:10px">Show data table</button>
      <div id="table" hidden style="margin-top:12px" class="scroll"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Away</h2><span class="note" id="away-note"></span></div>
      <div class="places" id="places"></div>
    </div>

    <div id="error" class="err" hidden></div>
  </div>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>

<script type="module">
"use strict";
const KEY_STORAGE = "workout-tracker.apiKey", THEME_STORAGE = "workout-tracker.theme", PLACE_STORAGE = "workout-tracker.places";
const state = { key: "", data: null, colour: "glow", activities: new Set(), range: "all", view: "home", place: null, hover: null, cam: null };
function readStored(n) { try { return localStorage.getItem(n) ?? ""; } catch { return ""; } }
function writeStored(n, v) { try { v ? localStorage.setItem(n, v) : localStorage.removeItem(n); } catch {} }
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
/* Fixed colour per activity, never by rank. */
const SLOT = { walking: "--cat-1", cycling: "--cat-3", running: "--cat-2", hiking: "--cat-4", swimming: "--cat-7", paddlesports: "--cat-5" };
const LABEL = { walking: "Walking", cycling: "Cycling", running: "Running", hiking: "Hiking", swimming: "Swimming", paddlesports: "Paddling" };
const label = (a) => LABEL[a] ?? a;
const colourOf = (a) => css(SLOT[a] ?? "--cat-rest");

/* ---- geometry: decode once, project to Web Mercator once ---- */
function decode(encoded) { const out = []; let i = 0, lat = 0, lon = 0; const next = () => { let r = 0, s = 0, b; do { b = encoded.charCodeAt(i++) - 63; r |= (b & 0x1f) << s; s += 5; } while (b >= 0x20); return r & 1 ? ~(r >> 1) : r >> 1; }; while (i < encoded.length) { lat += next(); lon += next(); out.push([lon / 1e5, lat / 1e5]); } return out; }
const merc = ([lon, lat]) => [lon * Math.PI / 180, Math.log(Math.tan(Math.PI / 4 + (lat * Math.PI / 180) / 2))];
function prepare(data) {
  for (const r of data.routes) { r.m = decode(r.polyline).map(merc); const xs = r.m.map((p) => p[0]), ys = r.m.map((p) => p[1]); r.bb = [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)]; }
}
const bboxOf = (routes) => routes.reduce((b, r) => [Math.min(b[0], r.bb[0]), Math.min(b[1], r.bb[1]), Math.max(b[2], r.bb[2]), Math.max(b[3], r.bb[3])], [Infinity, Infinity, -Infinity, -Infinity]);
/* A tight extent for the home map: drop the far 2% of route centres so one ride out of town does not shrink the city. */
function tightBbox(routes) {
  if (routes.length < 50) { const b = bboxOf(routes); return pad(b); }
  const cx = routes.map((r) => (r.bb[0] + r.bb[2]) / 2).sort((a, b) => a - b), cy = routes.map((r) => (r.bb[1] + r.bb[3]) / 2).sort((a, b) => a - b);
  const q = (a, p) => a[Math.min(a.length - 1, Math.floor(a.length * p))];
  return pad([q(cx, 0.02), q(cy, 0.02), q(cx, 0.98), q(cy, 0.98)]);
}
function pad(b) { const w = Math.max(b[2] - b[0], 1e-4), h = Math.max(b[3] - b[1], 1e-4); return [b[0] - w * 0.08, b[1] - h * 0.08, b[2] + w * 0.08, b[3] + h * 0.08]; }

/* ---- what is shown: the selected view, activities and range ---- */
function visible() {
  const { routes } = state.data; const since = state.range === "all" ? "" : new Date(Date.now() - Number(state.range) * 365.25 * 86_400_000).toISOString();
  return routes.filter((r) => (state.view === "home" ? r.place === null : r.place === state.place) && state.activities.has(r.activityType) && r.startedAt >= since);
}

/* ---- the hero canvas: pan, zoom, hover ---- */
const hero = document.getElementById("hero"); const hctx = hero.getContext("2d");
function camFor(routes) { const bb = state.view === "home" ? tightBbox(routes) : pad(bboxOf(routes)); const W = hero.clientWidth, H = hero.clientHeight; const s = Math.min(W / (bb[2] - bb[0]), H / (bb[3] - bb[1])); return { s, x: (W - (bb[2] - bb[0]) * s) / 2 - bb[0] * s, y: (H - (bb[3] - bb[1]) * s) / 2 + bb[3] * s }; }
const project = (p) => [state.cam.x + p[0] * state.cam.s, state.cam.y - p[1] * state.cam.s];
function renderHero() {
  const routes = visible(); const W = hero.clientWidth || 1000, H = Math.round(Math.min(640, Math.max(360, W * 0.6)));
  const dpr = Math.min(2, devicePixelRatio || 1); hero.width = W * dpr; hero.height = H * dpr; hero.style.height = `${H}px`; hctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  hctx.fillStyle = css("--canvas"); hctx.fillRect(0, 0, W, H);
  document.getElementById("hero-tag").textContent = routes.length ? `${routes.length} routes · ${Math.round(routes.reduce((n, r) => n + r.distanceMeters, 0) / 1000).toLocaleString()} km` : "no routes match";
  if (!routes.length) return;
  if (!state.cam) state.cam = camFor(routes);
  const byAct = state.colour === "activity"; const dense = routes.length > 300; const alpha = dense ? (byAct ? 0.14 : 0.07) : (byAct ? 0.5 : 0.35);
  hctx.globalCompositeOperation = "lighter"; hctx.lineWidth = 1.3; hctx.lineJoin = "round"; hctx.lineCap = "round";
  for (const r of routes) {
    if (r === state.hover) continue;
    hctx.strokeStyle = byAct ? colourOf(r.activityType) : css("--glow"); hctx.globalAlpha = alpha; hctx.beginPath();
    r.m.forEach((p, i) => { const [x, y] = project(p); if (i) hctx.lineTo(x, y); else hctx.moveTo(x, y); }); hctx.stroke();
  }
  hctx.globalCompositeOperation = "source-over"; hctx.globalAlpha = 1;
  if (state.hover) { hctx.strokeStyle = "#fff"; hctx.lineWidth = 2.5; hctx.beginPath(); state.hover.m.forEach((p, i) => { const [x, y] = project(p); if (i) hctx.lineTo(x, y); else hctx.moveTo(x, y); }); hctx.stroke(); }
  document.getElementById("legend").replaceChildren(...(byAct ? [...new Set(routes.map((r) => r.activityType))].map((a) => { const s = document.createElement("span"); const i = document.createElement("i"); i.style.background = colourOf(a); const t = document.createElement("span"); t.textContent = `${label(a)} · ${routes.filter((r) => r.activityType === a).length}`; s.append(i, t); return s; }) : []));
}
/* Nearest route to the pointer, within 8 px, measured against segment midpoints — cheap and good enough at this density. */
function pick(x, y) {
  let best = null, bd = 64;
  for (const r of visible()) { if (project([r.bb[0], r.bb[3]])[0] - 8 > x || project([r.bb[2], r.bb[1]])[0] + 8 < x) continue;
    for (let i = 1; i < r.m.length; i++) { const [ax, ay] = project(r.m[i - 1]), [bx, by] = project(r.m[i]); const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1; const t = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / l2)); const ex = x - (ax + t * dx), ey = y - (ay + t * dy); const d = ex * ex + ey * ey; if (d < bd) { bd = d; best = r; } } }
  return best;
}
const tip = document.getElementById("tip");
function showTip(e, r) { tip.replaceChildren(); const h = document.createElement("div"); h.className = "tip-head"; h.textContent = new Date(r.startedAt).toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }); tip.appendChild(h);
  for (const [k, v] of [["", label(r.activityType)], ["", `${(r.distanceMeters / 1000).toFixed(1)} km`]]) { const row = document.createElement("div"); row.className = "tip-row"; const vv = document.createElement("span"); vv.className = "v"; vv.textContent = v; row.append(vv); tip.appendChild(row); }
  tip.dataset.show = "1"; tip.style.left = `${Math.min(innerWidth - 220, e.clientX + 14)}px`; tip.style.top = `${Math.max(8, e.clientY - 60)}px`; }
let drag = null;
hero.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, cx: state.cam.x, cy: state.cam.y, moved: false }; hero.setPointerCapture(e.pointerId); hero.classList.add("dragging"); });
hero.addEventListener("pointermove", (e) => {
  const rect = hero.getBoundingClientRect(); const x = e.clientX - rect.left, y = e.clientY - rect.top;
  if (drag) { state.cam.x = drag.cx + (e.clientX - drag.x); state.cam.y = drag.cy + (e.clientY - drag.y); drag.moved = true; renderHero(); return; }
  const r = pick(x, y); if (r !== state.hover) { state.hover = r; renderHero(); } if (r) showTip(e, r); else tip.dataset.show = "0";
});
hero.addEventListener("pointerup", () => { drag = null; hero.classList.remove("dragging"); });
hero.addEventListener("pointerleave", () => { drag = null; hero.classList.remove("dragging"); if (state.hover) { state.hover = null; renderHero(); } tip.dataset.show = "0"; });
hero.addEventListener("wheel", (e) => { e.preventDefault(); const rect = hero.getBoundingClientRect(); const x = e.clientX - rect.left, y = e.clientY - rect.top; const f = Math.exp(-e.deltaY * 0.0015); state.cam = { s: state.cam.s * f, x: x - (x - state.cam.x) * f, y: y - (y - state.cam.y) * f }; renderHero(); }, { passive: false });

/* ---- away places: a small canvas each; click to make it the hero ---- */
function renderPlaces() {
  const host = document.getElementById("places"), note = document.getElementById("away-note"); const { places, routes } = state.data;
  if (!places.length) { host.replaceChildren(); note.textContent = "every route so far starts at home"; return; }
  note.textContent = `${places.length} places · a place is anywhere a route starts more than 15 km from home; places within 40 km of each other are one`;
  host.replaceChildren(...places.map((p) => {
    const btn = document.createElement("button"); btn.className = "place"; btn.type = "button"; btn.dataset.place = p.index;
    const c = document.createElement("canvas"); const W = 160, H = 100, dpr = 2; c.width = W * dpr; c.height = H * dpr; c.style.height = `${H}px`; const ctx = c.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = css("--canvas"); ctx.fillRect(0, 0, W, H);
    const rs = routes.filter((r) => r.place === p.index); const bb = pad(bboxOf(rs)); const s = Math.min(W / (bb[2] - bb[0]), H / (bb[3] - bb[1])); const ox = (W - (bb[2] - bb[0]) * s) / 2 - bb[0] * s, oy = (H - (bb[3] - bb[1]) * s) / 2 + bb[3] * s;
    ctx.globalCompositeOperation = "lighter"; ctx.lineWidth = 1.4; ctx.globalAlpha = rs.length > 20 ? 0.2 : 0.6; ctx.strokeStyle = css("--glow");
    for (const r of rs) { ctx.beginPath(); r.m.forEach((q, i) => { const x = ox + q[0] * s, y = oy - q[1] * s; if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); }); ctx.stroke(); }
    const name = document.createElement("b"); name.textContent = placeName(p) ?? `${p.centre.lat.toFixed(2)}°, ${p.centre.lon.toFixed(2)}°`; name.dataset.place = p.index;
    const l = document.createElement("div"); l.className = "l"; l.textContent = `${p.routes} route${p.routes === 1 ? "" : "s"} · ${Math.round(rs.reduce((n, r) => n + r.distanceMeters, 0) / 1000)} km · ${p.first.slice(0, 7)}${p.first.slice(0, 7) !== p.last.slice(0, 7) ? ` – ${p.last.slice(0, 7)}` : ""}`;
    btn.append(c, name, l); btn.addEventListener("click", () => { state.view = "place"; state.place = p.index; state.cam = null; state.hover = null; renderAll(); scrollTo({ top: 0, behavior: "smooth" }); });
    return btn;
  }));
  nameAll();
}
/* Place names via Nominatim, one request a second, remembered in this browser; coordinates until then. */
const names = (() => { try { return JSON.parse(readStored(PLACE_STORAGE) || "{}"); } catch { return {}; } })();
const nameKey = (p) => `${p.centre.lat.toFixed(2)},${p.centre.lon.toFixed(2)}`;
const placeName = (p) => names[nameKey(p)];
let naming = false;
async function nameAll() {
  if (naming) return; naming = true;
  for (const p of state.data.places) {
    if (placeName(p)) continue;
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&lat=${p.centre.lat}&lon=${p.centre.lon}`, { headers: { accept: "application/json" } });
      if (r.ok) { const j = await r.json(); const a = j.address ?? {}; const town = a.city || a.town || a.village || a.municipality || a.county || j.name; names[nameKey(p)] = [town, a.country].filter(Boolean).join(", ") || "Unknown place"; writeStored(PLACE_STORAGE, JSON.stringify(names)); for (const el of document.querySelectorAll(`b[data-place="${p.index}"]`)) el.textContent = names[nameKey(p)]; if (state.view === "place" && state.place === p.index) renderTitle(); }
    } catch { /* offline or blocked: the coordinates stay */ }
    await new Promise((res) => setTimeout(res, 1100));
  }
  naming = false;
}

function renderTitle() {
  const t = document.getElementById("hero-title"), n = document.getElementById("hero-note"), back = document.getElementById("back-home");
  if (state.view === "home") { t.textContent = "Home"; n.textContent = "routes that start within 15 km of where most of them start"; back.hidden = true; }
  else { const p = state.data.places.find((x) => x.index === state.place); t.textContent = placeName(p) ?? `${p.centre.lat.toFixed(2)}°, ${p.centre.lon.toFixed(2)}°`; n.textContent = `${p.first} – ${p.last}`; back.hidden = false; }
}
function renderTable() {
  const rows = visible().slice().reverse();
  document.getElementById("table").replaceChildren(buildTable(["Date", "Activity", { text: "Distance", num: true }, { text: "Points", num: true }], rows.map((r) => [new Date(r.startedAt).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }), label(r.activityType), { text: `${(r.distanceMeters / 1000).toFixed(1)} km`, num: true }, { text: `${r.points}`, num: true }])));
}
function buildTable(headers, rows) {
  const t = document.createElement("table"), th = document.createElement("thead"), hr = document.createElement("tr");
  for (const h of headers) { const c = document.createElement("th"); const s = typeof h === "string" ? { text: h } : h; if (s.num) c.className = "num"; c.textContent = s.text; hr.appendChild(c); }
  th.appendChild(hr); const tb = document.createElement("tbody");
  for (const r of rows) { const tr = document.createElement("tr"); for (const cell of r) { const td = document.createElement("td"); const s = typeof cell === "string" ? { text: cell } : cell; if (s.num) td.className = "num"; td.textContent = s.text; tr.appendChild(td); } tb.appendChild(tr); }
  t.append(th, tb); return t;
}
function renderAll() { renderTitle(); renderHero(); if (!document.getElementById("table").hidden) renderTable(); }

async function load() {
  const app = document.getElementById("app"), err = document.getElementById("error"); app.classList.add("stale"); err.hidden = true;
  try {
    const r = await fetch("/api/routes/data", { headers: { "x-api-key": state.key } });
    if (r.status === 401) { signOut("That key was rejected."); return; }
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    state.data = await r.json(); prepare(state.data);
    const acts = [...new Set(state.data.routes.map((x) => x.activityType))].sort((a, b) => state.data.routes.filter((x) => x.activityType === b).length - state.data.routes.filter((x) => x.activityType === a).length);
    state.activities = new Set(acts);
    const g = document.getElementById("activity-group"); g.replaceChildren(...acts.map((a) => { const b = document.createElement("button"); b.type = "button"; b.dataset.activity = a; b.textContent = `${label(a)} · ${state.data.routes.filter((x) => x.activityType === a).length}`; b.setAttribute("aria-pressed", "true"); return b; }));
    if (!g.dataset.wired) { g.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; const a = b.dataset.activity; if (state.activities.has(a)) { if (state.activities.size === 1) return; state.activities.delete(a); } else state.activities.add(a); b.setAttribute("aria-pressed", String(state.activities.has(a))); renderAll(); }); g.dataset.wired = "1"; }
    const first = state.data.routes[0], last = state.data.routes[state.data.routes.length - 1];
    document.getElementById("span-label").textContent = first ? `${state.data.count} routes · ${first.startedAt.slice(0, 7)} – ${last.startedAt.slice(0, 7)} · ${Math.round(state.data.routes.reduce((n, x) => n + x.distanceMeters, 0) / 1000).toLocaleString()} km` : "no routes yet — run the export import with the workout-routes folder";
    state.view = "home"; state.cam = null; renderAll(); renderPlaces();
  } catch (e) { err.textContent = `Could not load routes: ${e.message}`; err.hidden = false; }
  finally { app.classList.remove("stale"); }
}
function wireGroup(id, attr, onPick) {
  const g = document.getElementById(id); const sel = (v) => { for (const b of g.querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset[attr] === v)); };
  g.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; sel(b.dataset[attr]); onPick(b.dataset[attr]); }); sel(state[attr]);
}
function init() {
  const t = readStored(THEME_STORAGE); if (t) document.documentElement.setAttribute("data-theme", t);
  wireGroup("colour-group", "colour", (v) => { state.colour = v; renderHero(); });
  wireGroup("range-group", "range", (v) => { state.range = v; state.cam = null; renderAll(); });
  document.getElementById("back-home").addEventListener("click", () => { state.view = "home"; state.place = null; state.cam = null; state.hover = null; renderAll(); });
  document.getElementById("toggle-table").addEventListener("click", (e) => { const p = document.getElementById("table"); p.hidden = !p.hidden; e.target.textContent = p.hidden ? "Show data table" : "Hide data table"; if (!p.hidden) renderTable(); });
  document.getElementById("theme-toggle").addEventListener("click", () => { const c = document.documentElement.getAttribute("data-theme"); const d = matchMedia("(prefers-color-scheme: dark)").matches; const n = c ? (c === "dark" ? "light" : "dark") : (d ? "light" : "dark"); document.documentElement.setAttribute("data-theme", n); writeStored(THEME_STORAGE, n); if (state.data) { renderAll(); renderPlaces(); } });
  document.getElementById("gate-go").addEventListener("click", () => { const v = document.getElementById("gate-key").value.trim(); if (v) start(v); });
  document.getElementById("gate-key").addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("gate-go").click(); });
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (state.data) { state.cam = null; renderHero(); } }, 120); });
  const fromUrl = new URL(location.href).searchParams.get("key"); if (fromUrl) history.replaceState(null, "", location.pathname);
  const key = fromUrl || readStored(KEY_STORAGE); if (key) start(key); else signOut();
}
function signOut(msg) { state.key = ""; writeStored(KEY_STORAGE, ""); document.getElementById("app").hidden = true; const g = document.getElementById("gate"); g.hidden = false; const e = document.getElementById("gate-err"); e.hidden = !msg; if (msg) e.textContent = msg; document.getElementById("gate-key").focus(); }
function start(key) { state.key = key; writeStored(KEY_STORAGE, key); document.getElementById("gate").hidden = true; document.getElementById("app").hidden = false; load(); }
init();
</script>
</body>
